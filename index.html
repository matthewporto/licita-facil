function montarPdfPedidoConteudo(doc, left, p, itens){
  const cancelado = p.status==='Cancelado';
  let valorTotalCalc=0, valorSeparadoCalc=0, valorEntregueCalc=0, lucroTotalCalc=0, valorComCustoCalc=0;
  itens.forEach(it=>{
    const qtd=Number(it.quantidade)||0, unit=Number(it.valorUnitario)||0, custo=Number(it.valorCusto)||0;
    valorTotalCalc += qtd*unit;
    valorSeparadoCalc += Math.min(Number(it.quantidadeSeparada)||0, qtd)*unit;
    valorEntregueCalc += Math.min(Number(it.quantidadeEntregue)||0, qtd)*unit;
    if(custo>0){ lucroTotalCalc += qtd*(unit-custo); valorComCustoCalc += qtd*unit; }
  });
  const saldoSeparar = cancelado?0:(valorTotalCalc-valorSeparadoCalc);
  const saldoEntregar = cancelado?0:(valorTotalCalc-valorEntregueCalc);
  const margemLucroCalc = valorComCustoCalc>0 ? (lucroTotalCalc/valorComCustoCalc*100) : null;

  const pageWidth = doc.internal.pageSize.getWidth();
  const rightX = pageWidth - left;

  let y = 42;
  doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(20);
  doc.text(p.cidade || '—', left, y);

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100);
  doc.text('DATA', rightX, y-22, {align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20);
  doc.text(fmtDate(p.dataPedido)||'—', rightX, y-9, {align:'right'});

  y += 22;
  doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(70);
  doc.text(p.secretaria || '—', left, y);

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100);
  doc.text('PRAZO DE ENTREGA', rightX, y-13, {align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20);
  doc.text(p.dataLimiteEntrega ? fmtDate(p.dataLimiteEntrega) : 'Sem prazo definido', rightX, y, {align:'right'});

  y += 14;
  doc.setDrawColor(210); doc.line(left, y, rightX, y);
  y += 20;

  const localEntregaTexto = p.localEntregaNome
    ? p.localEntregaNome + (p.localEntregaEndereco?' — '+p.localEntregaEndereco:'') + (p.localEntregaCidade?', '+p.localEntregaCidade+(p.localEntregaEstado?'/'+p.localEntregaEstado:''):'')
    : '';
  const ataDoPedido = ataById(p.ataId);
  [['Empresa', ataDoPedido && ataDoPedido.empresaNome], ['Órgão', p.orgao], ['Ata/Contrato', p.ataNumero],
   ['Ordem de compra', p.ordemCompra], ['Empenho', p.empenho], ['Local de entrega', localEntregaTexto], ['Status', STATUS_PEDIDO_LABEL[p.status]||p.status],
   ['Valor total', pdfBRL(valorTotalCalc)], ['Saldo a separar', pdfBRL(saldoSeparar)], ['Saldo a entregar', pdfBRL(saldoEntregar)],
   ['Margem de lucro', margemLucroCalc===null?'—':margemLucroCalc.toFixed(1)+'%']]
  .forEach(([label,value])=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100);
    doc.text(label+':', left, y);
    doc.setFont('helvetica','bold'); doc.setTextColor(20);
    doc.text(value===undefined||value===null||value===''?'—':String(value), left+95, y);
    y += 13;
  });
  y += 6;

  const colunas = ['Item','Lote','Descrição','Marca','Un.','Quantidade','Separada','Entregue','Saldo','Valor unit.','Valor de custo','Lucro','Margem','Subtotal'];
  const linhas = ordenarPorNumeroItem(itens).map(it=>{
    const qtd = Number(it.quantidade)||0;
    const sep = cancelado?0:Math.min(Number(it.quantidadeSeparada)||0, qtd);
    const ent = cancelado?0:Math.min(Number(it.quantidadeEntregue)||0, qtd);
    const saldoItem = cancelado?0:(qtd-ent);
    const unit = Number(it.valorUnitario)||0;
    const custo = Number(it.valorCusto)||0;
    const lucroUnit = unit-custo;
    const margem = custo>0 ? (lucroUnit/unit*100) : null;

async function prepararPdf(){
  if(typeof window.jspdf==='undefined' || !window.jspdf.jsPDF){
    toast('O gerador de PDF ainda está carregando. Tente novamente em instantes.', 'crit');
    return null;
  }
  return { jsPDF: window.jspdf.jsPDF, downloadsApi: criarDownloadsLocal() };
}

async function salvarPdf(doc, filename, downloadsApi){
  const blob = doc.output('blob');
  try{
    await downloadsApi.save({filename, data:blob});
    toast('PDF gerado com sucesso.');
  }catch(e){
    const code = e && e.code;
    if(code==='declined'){ /* usuário cancelou o download, nada a avisar */ }
    else if(code==='too_large') toast('O PDF ficou grande demais para baixar.', 'crit');
    else if(code==='rate_limited') toast('Aguarde um instante e tente novamente.', 'crit');
    else toast('Não foi possível baixar o PDF.', 'crit');
  }
}

function montarImpressaoPedidoConteudo(p, itens){
  const cancelado = p.status==='Cancelado';
  let valorTotalCalc=0, valorSeparadoCalc=0, valorEntregueCalc=0, lucroTotalCalc=0, valorComCustoCalc=0;
  itens.forEach(it=>{
    const qtd=Number(it.quantidade)||0, unit=Number(it.valorUnitario)||0, custo=Number(it.valorCusto)||0;
    valorTotalCalc += qtd*unit;
    valorSeparadoCalc += Math.min(Number(it.quantidadeSeparada)||0, qtd)*unit;
    valorEntregueCalc += Math.min(Number(it.quantidadeEntregue)||0, qtd)*unit;
    if(custo>0){ lucroTotalCalc += qtd*(unit-custo); valorComCustoCalc += qtd*unit; }
  });
  const saldoSeparar = cancelado?0:(valorTotalCalc-valorSeparadoCalc);
  const saldoEntregar = cancelado?0:(valorTotalCalc-valorEntregueCalc);
  const margemLucroCalc = valorComCustoCalc>0 ? (lucroTotalCalc/valorComCustoCalc*100) : null;

  const localEntregaTexto = p.localEntregaNome
    ? p.localEntregaNome + (p.localEntregaEndereco?' — '+p.localEntregaEndereco:'') + (p.localEntregaCidade?', '+p.localEntregaCidade+(p.localEntregaEstado?'/'+p.localEntregaEstado:''):'')
    : '';
  const ataDoPedido = ataById(p.ataId);
  const campos = [['Empresa', ataDoPedido && ataDoPedido.empresaNome], ['Órgão', p.orgao], ['Ata/Contrato', p.ataNumero],
   ['Ordem de compra', p.ordemCompra], ['Empenho', p.empenho], ['Local de entrega', localEntregaTexto], ['Status', STATUS_PEDIDO_LABEL[p.status]||p.status],
   ['Valor total', pdfBRL(valorTotalCalc)], ['Saldo a separar', pdfBRL(saldoSeparar)], ['Saldo a entregar', pdfBRL(saldoEntregar)],
   ['Margem de lucro', margemLucroCalc===null?'—':margemLucroCalc.toFixed(1)+'%']];

  const colunas = ['Item','Lote','Descrição','Marca','Un.','Quantidade','Separada','Entregue','Saldo','Valor unit.','Valor de custo','Lucro','Margem','Subtotal'];
  const linhas = ordenarPorNumeroItem(itens).map(it=>{
    const qtd = Number(it.quantidade)||0;
    const sep = cancelado?0:Math.min(Number(it.quantidadeSeparada)||0, qtd);
    const ent = cancelado?0:Math.min(Number(it.quantidadeEntregue)||0, qtd);
    const saldoItem = cancelado?0:(qtd-ent);
    const unit = Number(it.valorUnitario)||0;
    const custo = Number(it.valorCusto)||0;
    const lucroUnit = unit-custo;
    const margem = custo>0 ? (lucroUnit/unit*100) : null;
    return [
      it.numeroItem||'—', it.lote||'—', it.descricao||'', it.marca||'—', it.unidade||'—',
      qtd, sep, ent, saldoItem, pdfBRL(unit), custo>0?pdfBRL(custo):'—', custo>0?pdfBRL(lucroUnit):'—', margem!==null?margem.toFixed(1)+'%':'—', pdfBRL(qtd*unit),
    ];
  });

  const header = '<div class="doc-header">'
    + '<div><div class="doc-title">'+esc(p.cidade||'—')+'</div><div class="doc-subtitle">'+esc(p.secretaria||'—')+'</div></div>'
    + '<div class="doc-header-right">'
      + '<div class="doc-box"><span class="label">DATA</span><b>'+esc(fmtDate(p.dataPedido)||'—')+'</b></div>'
      + '<div class="doc-box"><span class="label">PRAZO DE ENTREGA</span><b>'+esc(p.dataLimiteEntrega?fmtDate(p.dataLimiteEntrega):'Sem prazo definido')+'</b></div>'
    + '</div>'
  + '</div><hr class="doc-hr">';
  return header + htmlCamposImpressao(campos) + htmlTabelaImpressao(colunas, linhas);
}

function imprimirPagina(){
  let html = null, landscape = true;
  if(state.view==='pedido-detail'){ html = montarImpressaoPedido(); landscape = false; }
  else if(state.view==='pedidocompra-detail'){ html = montarImpressaoPedidoCompra(); landscape = true; }
  else if(state.view==='fatura-detail'){ html = montarImpressaoFatura(); landscape = true; }
  if(!html){ toast('Não é possível imprimir nesta tela.', 'crit'); return; }
  document.getElementById('print-area').innerHTML = html;
  let pageStyle = document.getElementById('print-page-style');
  if(!pageStyle){ pageStyle = document.createElement('style'); pageStyle.id = 'print-page-style'; document.head.appendChild(pageStyle); }
  pageStyle.textContent = '@page{ size:'+(landscape?'landscape':'portrait')+'; margin:14mm; }';
  document.body.classList.add('printing-doc');
  window.print();
}
window.addEventListener('afterprint', ()=>{ document.body.classList.remove('printing-doc'); });

async function abrirImpressao(){
  const prep = await prepararPdf();
  if(!prep) return;
  const { jsPDF, downloadsApi } = prep;
  const orientation = state.view==='pedido-detail' ? 'portrait' : 'landscape';
  const doc = new jsPDF({orientation, unit:'pt', format:'a4'});
  const left = 30;
  let filename = null;
  if(state.view==='pedido-detail') filename = montarPdfPedido(doc, left);
  else if(state.view==='pedidocompra-detail') filename = montarPdfPedidoCompra(doc, left);
  else if(state.view==='fatura-detail') filename = montarPdfFatura(doc, left);
  if(!filename){ toast('Não é possível gerar PDF nesta tela.', 'crit'); return; }
  await salvarPdf(doc, filename, downloadsApi);
}

        qtd, sep, ent, saldo,
        (Number(it.valorUnitario)||0).toFixed(2).replace('.',','),
        (qtd*(Number(it.valorUnitario)||0)).toFixed(2).replace('.',','),
      ].join('\t'));
    });
  });
  const ok = await copyTextToClipboard(lines.join('\n'));
  toast(ok ? 'Copiado! Cole (Ctrl+V) numa planilha do Excel ou Google Sheets.' : 'Não foi possível copiar automaticamente — tente novamente.');
}

async function copyPedidoCompraExcel(pedidoCompraId){
  const pc = pedidoCompraById(pedidoCompraId);
  if(!pc) return;
  const itens = state.currentPedidoCompraItens;
  const header = ['Órgão','Secretaria','Ordem de compra','Empenho','Item','Lote','Descrição','Marca','Un.','Quantidade','Recebida','Saldo a receber','Valor unit.','Subtotal'];
  const cancelado = pc.status==='Cancelado';
  const lines = [header.join('\t')];
  itens.forEach(it=>{
    const qtd = Number(it.quantidade)||0;
    const rec = cancelado?0:Math.min(Number(it.quantidadeRecebida)||0, qtd);
    const saldo = cancelado?0:(qtd-rec);
    const origemP = it.origemPedidoId ? pedidoById(it.origemPedidoId) : null;
    lines.push([
      (origemP&&origemP.orgao)||'', (origemP&&origemP.secretaria)||'', (origemP&&origemP.ordemCompra)||'', (origemP&&origemP.empenho)||'',
      it.numeroItem||'', it.lote||'', it.descricao||'', it.marca||'', it.unidade||'',
      qtd, rec, saldo,
      (Number(it.valorUnitario)||0).toFixed(2).replace('.',','),
      (qtd*(Number(it.valorUnitario)||0)).toFixed(2).replace('.',','),
    ].join('\t'));
  });
  const ok = await copyTextToClipboard(lines.join('\n'));
  toast(ok ? 'Copiado! Cole (Ctrl+V) numa planilha do Excel ou Google Sheets.' : 'Não foi possível copiar automaticamente — tente novamente.');
}

function renderLucro(){
  const ano = state.lucroAno;
  const dadosMeses = Array.from({length:12}, (_,i)=>{
    const mes = i+1;
    const bruto = lucroBrutoMes(ano, mes);
    const despesas = despesasTotalMes(ano, mes);
    return { mes, bruto, despesas, liquido: bruto-despesas, faturasCount: faturasDoMes(ano, mes).length };
  });
  const brutoAnual = dadosMeses.reduce((s,m)=>s+m.bruto,0);
  const despesasAnual = dadosMeses.reduce((s,m)=>s+m.despesas,0);
  const liquidoAnual = brutoAnual - despesasAnual;
  const maxAbsLiquido = Math.max(1, ...dadosMeses.map(m=>Math.abs(m.liquido)));
  const mesAtualNum = (ano===new Date().getFullYear()) ? (new Date().getMonth()+1) : null;

  return `
    <div class="topbar">
      <div><h1>Lucro</h1><div class="sub">Lucro das faturas emitidas menos as despesas de cada mês.</div></div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" onclick="state.lucroAno=state.lucroAno-1; render();">${ICONS.chevronLeft}</button>
        <div class="btn btn-ghost btn-sm mono" style="pointer-events:none">${ano}</div>
        <button class="btn btn-ghost btn-sm" onclick="state.lucroAno=state.lucroAno+1; render();">${ICONS.chevronRight}</button>
      </div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">Lucro bruto anual</div><div class="value ${brutoAnual<0?'crit':'ok'}">${fmtBRL(brutoAnual)}</div></div>
      <div class="kpi"><div class="label">Despesas anuais</div><div class="value">${fmtBRL(despesasAnual)}</div></div>
      <div class="kpi"><div class="label">Lucro líquido anual</div><div class="value ${liquidoAnual<0?'crit':'ok'}">${fmtBRL(liquidoAnual)}</div></div>
    </div>
    <div class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>Mês</th><th>Faturas</th><th>Lucro bruto</th><th>Despesas</th><th>Lucro líquido</th><th style="min-width:120px">​</th></tr></thead>
        <tbody>
          ${dadosMeses.map(m=>{
            const barPct = Math.min(100, Math.abs(m.liquido)/maxAbsLiquido*100);
            const barColor = m.liquido<0 ? 'var(--crit)' : 'var(--ok)';
            return `<tr onclick="setView('lucro-detail',{ano:${ano},mes:${m.mes}})">
              <td>${mesLabel(m.mes)}${mesAtualNum===m.mes?' <span class="pill neutral" style="margin-left:4px">atual</span>':''}</td>
              <td class="num">${m.faturasCount}</td>
              <td class="num">${fmtBRL(m.bruto)}</td>
              <td class="num">${fmtBRL(m.despesas)}</td>
              <td class="num" style="color:${m.liquido<0?'var(--crit)':'var(--ok)'}">${fmtBRL(m.liquido)}</td>
              <td><div style="background:var(--surface-2); border-radius:4px; overflow:hidden; height:8px; width:100%"><div style="width:${barPct}%; height:100%; background:${barColor}"></div></div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>`;
}

function renderLucroDetail(){
  const ano = state.currentLucroAno;
  const mes = state.currentLucroMes;
  const faturas = faturasDoMes(ano, mes).sort((a,b)=>(a.dataEmissao||'').localeCompare(b.dataEmissao||''));
  const despesas = despesasDoMes(ano, mes);
  const bruto = lucroBrutoMes(ano, mes);
  const despesasTotal = despesasTotalMes(ano, mes);
  const liquido = bruto - despesasTotal;

  return `
    <div class="topbar">
      <div>
        <button class="btn btn-ghost btn-sm" style="margin-bottom:10px" onclick="setView('lucro')">${ICONS.back} Voltar</button>
        <h1>Lucro — ${mesLabel(mes)} / ${ano}</h1>
        <div class="sub">${faturas.length} fatura(s) neste mês</div>
      </div>
      <div class="actions">
        ${podeEditar()?`<button class="btn btn-primary" onclick="openDespesaForm('${anoMesStr(ano,mes)}')">${ICONS.plus}Nova despesa</button>`:''}
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="label">Lucro bruto (faturas)</div><div class="value ${bruto<0?'crit':'ok'}">${fmtBRL(bruto)}</div></div>
      <div class="kpi"><div class="label">Despesas do mês</div><div class="value">${fmtBRL(despesasTotal)}</div></div>
      <div class="kpi"><div class="label">Lucro líquido do mês</div><div class="value ${liquido<0?'crit':'ok'}">${fmtBRL(liquido)}</div></div>
    </div>

    <h3 class="section-title">Faturas que compõem o lucro (${faturas.length})</h3>
    <div class="card">
      ${faturas.length===0 ? `<div class="empty"><h3>Nenhuma fatura emitida neste mês</h3><p>Faturas canceladas não entram nesta conta.</p></div>` : `
      <div class="table-wrap"><table>
        <thead><tr><th>Emissão</th><th>Nº Nota</th><th>Órgão</th><th>Valor</th><th>Lucro</th><th>Margem</th><th>Status</th></tr></thead>
        <tbody>
          ${faturas.map(f=>{
            const origemPedido = faturaOrigemPedido(f);
            const temCusto = Number(f.valorComCusto)>0;
            const lucroF = Number(f.lucroTotal)||0;
            const margem = temCusto ? (lucroF/Number(f.valorComCusto)*100) : null;
            return `<tr onclick="setView('fatura-detail',{faturaId:'${f.id}'})">
              <td>${fmtDate(f.dataEmissao)}</td>
              <td class="mono">${esc(f.numeroNota)}</td>
              <td>${esc(origemPedido&&origemPedido.orgao)||'—'}</td>
              <td class="num">${fmtBRL(f.valorTotal)}</td>
              <td class="num" style="color:${temCusto?(lucroF<0?'var(--crit)':'var(--ok)'):'inherit'}">${temCusto?fmtBRL(lucroF):'—'}</td>
              <td class="num">${margem===null?'—':margem.toFixed(1)+'%'}</td>
              <td><span class="pill ${STATUS_FATURA_LEVEL[f.status]||'neutral'}">${esc(STATUS_FATURA_LABEL[f.status]||f.status)}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>`}
    </div>

    <h3 class="section-title" style="margin-top:28px">Despesas do mês (${despesas.length})</h3>
    <div class="card">
      ${despesas.length===0 ? `<div class="empty"><h3>Nenhuma despesa lançada neste mês</h3><p>Use "Nova despesa" acima para lançar aluguel, salários ou outros custos que não vêm das Atas.</p></div>` : `
      <div class="table-wrap"><table>
        <thead><tr><th>Descrição</th><th>Valor</th><th></th></tr></thead>
        <tbody>
          ${despesas.map(d=>`
            <tr>
              <td>${esc(d.descricao)}</td>
              <td class="num">${fmtBRL(d.valor)}</td>
              <td style="white-space:nowrap">
                ${podeEditar()?`
                <button class="icon-btn" onclick='openDespesaForm("${anoMesStr(ano,mes)}", ${JSON.stringify(d).replace(/'/g,"&#39;")})'>${ICONS.edit}</button>
                <button class="icon-btn" onclick="deleteDespesa('${d.id}')">${ICONS.trash}</button>
                `:''}
              </td>
            </tr>`).join('')}
        </tbody>
      </table></div>`}
    </div>`;
}

function renderCustosMinimos(){
  let rows = state.custosMinimos;
  if(state.custoMinimoSearch.trim()){
    const q = state.custoMinimoSearch.toLowerCase();
    rows = rows.filter(c=> (c.item||'').toLowerCase().includes(q) || (c.fabricante||'').toLowerCase().includes(q) || (c.marca||'').toLowerCase().includes(q));
  }
  rows = [...rows].sort((a,b)=>(a.item||'').localeCompare(b.item||''));

  return `
    <div class="topbar">
      <div><h1>Custo/Mínimo</h1><div class="sub">${state.custosMinimos.length} item(ns) cadastrado(s)</div></div>
      <div class="actions">${podeEditar()?`<button class="btn btn-primary" onclick="openCustoMinimoForm()">${ICONS.plus}Novo item</button>`:''}</div>
    </div>
    <div class="toolbar">
      <div class="search">${ICONS.search}<input id="custo-minimo-search-input" placeholder="Buscar por item, fabricante ou marca..." value="${esc(state.custoMinimoSearch)}" oninput="state.custoMinimoSearch=this.value; render();"></div>
    </div>
    <div class="card">
      ${state.custosMinimos.length===0 ? `
      <div class="empty"><h3>Nenhum item cadastrado</h3><p>Cadastre os itens com seu custo e composição de preço mínimo.</p>
        ${podeEditar()?`<button class="btn btn-primary" onclick="openCustoMinimoForm()">${ICONS.plus}Novo item</button>`:''}</div>
      ` : rows.length===0 ? `<div class="empty"><h3>Nada encontrado</h3><p>Ajuste a busca.</p></div>` : `
      <div class="table-wrap"><table>
        <thead><tr><th>Item</th><th>Fabricante</th><th>Marca</th><th>Valor do item</th><th>Frete</th><th>IPI</th><th>Difal</th><th>Outra Disp.</th><th>Custo</th><th>Custo Unit.</th><th>Margem</th><th>Mínimo</th><th>Nº Unid.</th><th>Mínimo Unit.</th><th></th></tr></thead>
        <tbody>
          ${rows.map(c=>`
            <tr onclick='openCustoMinimoForm(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
              <td>${esc(c.item)}</td>
              <td>${esc(c.fabricante)||'—'}</td>
              <td>${esc(c.marca)||'—'}</td>
              <td class="num">${c.custo>0?fmtBRL(c.custo):'—'}</td>
              <td class="num">${c.frete>0?c.frete+'%':'—'}</td>
              <td class="num">${c.ipi>0?c.ipi+'%':'—'}</td>
              <td class="num">${c.difal>0?c.difal+'%':'—'}</td>
              <td class="num">${c.outraDisp>0?c.outraDisp+'%':'—'}</td>
              <td class="num">${c.custo>0?fmtBRL(custoValor(c)):'—'}</td>
              <td class="num">${c.numeroUnidades>0?fmtBRL(custoUnitarioValor(c)):'—'}</td>
              <td class="num">${c.custo>0?margemVendaValor(c)+'%':'—'}</td>
              <td class="num">${c.custo>0?fmtBRL(custoMinimoValor(c)):'—'}</td>
              <td class="num">${c.numeroUnidades>0?c.numeroUnidades:'—'}</td>
              <td class="num">${c.numeroUnidades>0?fmtBRL(minimoUnitarioValor(c)):'—'}</td>
              <td onclick="event.stopPropagation()">${podeEditar()?`<button class="icon-btn" onclick="deleteCustoMinimo('${c.id}')">${ICONS.trash}</button>`:''}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>`}
    </div>`;
}

function renderMain(){
  if(state.dbUnavailable){
    return `<div class="empty"><h3>Não foi possível conectar ao banco de dados</h3><p>Verifique se as credenciais do Firebase (FIREBASE_CONFIG) foram preenchidas corretamente no código, e se o projeto Firebase está com Firestore e Autenticação anônima habilitados.</p></div>`;
  }
  if(!state.dbReady){
    return `<div class="empty"><h3>Carregando…</h3></div>`;
  }
  if(state.view==='painel') return renderPainel();
  if(state.view==='atas') return renderAtasList();
  if(state.view==='ata-detail') return renderAtaDetail();
  if(state.view==='pedidos') return renderPedidosList();
  if(state.view==='pedido-detail') return renderPedidoDetail();
  if(state.view==='pedidoscompra') return renderPedidosCompraList();
  if(state.view==='pedidocompra-detail') return renderPedidoCompraDetail();
  if(state.view==='faturamento') return renderFaturasList();
  if(state.view==='fatura-detail') return renderFaturaDetail();
  if(state.view==='lucro') return renderLucro();
  if(state.view==='lucro-detail') return renderLucroDetail();
  if(state.view==='orgaos') return renderOrgaos();
  if(state.view==='orgao-detail') return renderOrgaoDetail();
  if(state.view==='empresas') return renderEmpresas();
  if(state.view==='custosminimos') return renderCustosMinimos();
  if(state.view==='usuarios') return renderUsuarios();
  return '';
}

function renderLogin(){
  const temAdminComSenha = state.usuarios.some(u=>u.senhaHash);
  if(!temAdminComSenha){
    return `
    <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:20px">
      <div class="card" style="max-width:420px;width:100%;padding:28px">
        <h2 style="margin:0 0 4px">Bem-vindo ao Licita Facil</h2>
        <p style="font-size:.85rem;color:var(--ink-soft);margin:0 0 20px">Nenhum administrador cadastrado ainda. Crie o primeiro usuário para começar a usar o sistema.</p>
        <div class="field" style="margin-bottom:12px"><label>Seu nome</label><input id="onboard-nome-input" onkeydown="if(event.key==='Enter') criarPrimeiroAdmin()"></div>
        <div class="field" style="margin-bottom:12px"><label>Senha</label><input type="password" id="onboard-senha-input" onkeydown="if(event.key==='Enter') criarPrimeiroAdmin()"></div>
        <div class="field" style="margin-bottom:8px"><label>Confirmar senha</label><input type="password" id="onboard-confirmar-input" onkeydown="if(event.key==='Enter') criarPrimeiroAdmin()"></div>
        <p id="onboard-erro" style="font-size:.8rem;color:var(--crit);min-height:1.2em;margin:0 0 12px"></p>
        <button type="button" class="btn btn-primary" style="width:100%" onclick="criarPrimeiroAdmin()">Criar administrador e entrar</button>
      </div>
    </div>`;
  }
  return `
    <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:20px">
      <div class="card" style="max-width:380px;width:100%;padding:28px">
        <h2 style="margin:0 0 4px">Licita Facil</h2>
        <p style="font-size:.85rem;color:var(--ink-soft);margin:0 0 20px">Entre com seu usuário e senha.</p>
        <div class="field" style="margin-bottom:12px"><label>Usuário</label><input id="login-nome-input" onkeydown="if(event.key==='Enter') tentarLogin()"></div>
        <div class="field" style="margin-bottom:8px"><label>Senha</label><input type="password" id="login-senha-input" onkeydown="if(event.key==='Enter') tentarLogin()"></div>
        <p id="login-erro" style="font-size:.8rem;color:var(--crit);min-height:1.2em;margin:0 0 12px"></p>
        <button type="button" class="btn btn-primary" style="width:100%" onclick="tentarLogin()">Entrar</button>
      </div>
    </div>`;
}

function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const hasSelection = active && typeof active.selectionStart==='number';
  const selStart = hasSelection ? active.selectionStart : null;
  const selEnd = hasSelection ? active.selectionEnd : null;
  if(state.dbReady && !state.dbUnavailable && !state.autenticado){
    document.getElementById('app').innerHTML = renderLogin();
  } else {
    document.getElementById('app').innerHTML = `${renderSidebar()}<div class="main">${renderMain()}</div>`;
  }
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
