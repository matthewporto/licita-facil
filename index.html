<title>Licita Facil</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#1A2130; --ink-soft:#5B6376; --ink-faint:#8A8F9C;
  --paper:#EFEDE7; --surface:#FFFFFF; --surface-2:#F7F5F0;
  --line:#DDD9CE; --line-soft:#E9E6DD;
  --accent:#1E4D6B; --accent-ink:#FFFFFF; --accent-soft:#E3EBF0; --accent-strong:#153B54;
  --brass:#A07434;
  --ok:#2F7D4E; --ok-soft:#E3F1E7;
  --warn:#B4791C; --warn-soft:#FAF0DC;
  --crit:#B23B3B; --crit-soft:#FAE7E5;
  --neutral:#6B6459; --neutral-soft:#ECE9E1;
  --shadow-sm:0 1px 2px rgba(26,33,48,.07);
  --shadow-md:0 8px 28px rgba(26,33,48,.12);
  --radius:10px;
  --font-display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-ui:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E9E6DC; --ink-soft:#AFACA0; --ink-faint:#7C7A70;
    --paper:#12161C; --surface:#1A2028; --surface-2:#1F2630;
    --line:#2C3340; --line-soft:#242A35;
    --accent:#6FA8CC; --accent-ink:#0D1620; --accent-soft:#1D2E3A; --accent-strong:#8FC0E0;
    --brass:#CBA25E;
    --ok:#5EBE85; --ok-soft:#173226;
    --warn:#E1A94A; --warn-soft:#332A0F;
    --crit:#E2807A; --crit-soft:#3A1F1E;
    --neutral:#A19C90; --neutral-soft:#252b23;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ink:#E9E6DC; --ink-soft:#AFACA0; --ink-faint:#7C7A70;
  --paper:#12161C; --surface:#1A2028; --surface-2:#1F2630;
  --line:#2C3340; --line-soft:#242A35;
  --accent:#6FA8CC; --accent-ink:#0D1620; --accent-soft:#1D2E3A; --accent-strong:#8FC0E0;
  --brass:#CBA25E;
  --ok:#5EBE85; --ok-soft:#173226;
  --warn:#E1A94A; --warn-soft:#332A0F;
  --crit:#E2807A; --crit-soft:#3A1F1E;
  --neutral:#A19C90; --neutral-soft:#252b23;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-ui);
  font-size:14px; line-height:1.5;
}
button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
a{ color:var(--accent); }
h1,h2,h3{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

.app{ display:flex; min-height:100vh; }

.sidebar{
  width:232px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
  padding:22px 14px; display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{ display:flex; align-items:baseline; gap:8px; padding:0 8px; }
.brand .mark{ font-family:var(--font-display); font-weight:700; font-size:1.28rem; letter-spacing:-.01em; }
.brand .tag{ font-size:.66rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; }
.nav-group{ display:flex; flex-direction:column; gap:2px; }
.nav-label{ font-size:.66rem; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint); padding:10px 12px 4px; }
.navitem{
  all:unset; box-sizing:border-box; cursor:pointer; padding:9px 12px; border-radius:8px; font-size:.87rem;
  color:var(--ink-soft); display:flex; gap:10px; align-items:center; justify-content:space-between;
}
.navitem .left{ display:flex; gap:10px; align-items:center; }
.navitem svg{ flex-shrink:0; width:17px; height:17px; }
.navitem:hover{ background:var(--surface-2); color:var(--ink); }
.navitem.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
.navitem .count{ font-family:var(--font-mono); font-size:.72rem; color:var(--ink-faint); }
.navitem[data-disabled]{ opacity:.5; cursor:default; }
.navitem[data-disabled]:hover{ background:transparent; color:var(--ink-soft); }
.navitem .soon{ font-size:.6rem; text-transform:uppercase; letter-spacing:.05em; background:var(--neutral-soft); color:var(--neutral); padding:2px 6px; border-radius:5px; }

.identity{ margin-top:auto; padding:10px 8px 0; border-top:1px solid var(--line-soft); }
.identity label{ font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); display:block; margin-bottom:5px; }
.identity input{ width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:7px; padding:7px 9px; font-size:.82rem; }

.main{ flex:1; min-width:0; padding:30px 40px 60px; }
.topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:26px; flex-wrap:wrap; }
.topbar h1{ font-size:1.55rem; }
.topbar .sub{ color:var(--ink-soft); font-size:.88rem; margin-top:4px; }
.topbar .actions{ display:flex; gap:10px; flex-wrap:wrap; }

.btn{
  font-family:var(--font-ui); font-weight:600; font-size:.83rem; padding:9px 15px; border-radius:8px;
  border:1px solid transparent; cursor:pointer; display:inline-flex; gap:6px; align-items:center; white-space:nowrap;
}
.btn svg{ width:14px; height:14px; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ background:var(--accent-strong); }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ background:var(--crit-soft); color:var(--crit); }
.btn-danger:hover{ filter:brightness(.95); }
.btn-sm{ padding:6px 10px; font-size:.76rem; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }

.kpi-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:30px; }
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px; box-shadow:var(--shadow-sm); }
.kpi .label{ font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
.kpi .value{ font-family:var(--font-mono); font-size:1.5rem; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; }
.kpi .value.warn{ color:var(--warn); } .kpi .value.crit{ color:var(--crit); } .kpi .value.ok{ color:var(--ok); }

.section-title{ font-size:.98rem; margin:0 0 12px; display:flex; align-items:center; gap:10px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
.card + .card{ margin-top:22px; }

.toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.search{ position:relative; flex:1; min-width:200px; }
.search input{ width:100%; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 12px 9px 32px; }
.search svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint); }
select.filter{ border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 10px; color:var(--ink); }

.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:.86rem; }
th{ text-align:left; font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
td{ padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
tbody tr{ cursor:pointer; }
tbody tr:hover td{ background:var(--surface-2); }
tbody tr:last-child td{ border-bottom:none; }
td.num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; }
td.truncate, .truncate{ max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
td.wrap-desc, .wrap-desc{ min-width:200px; max-width:320px; white-space:normal; word-break:break-word; }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:600; white-space:nowrap; }
.pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.ok{ background:var(--ok-soft); color:var(--ok); }
.pill.warn{ background:var(--warn-soft); color:var(--warn); }
.pill.crit{ background:var(--crit-soft); color:var(--crit); }
.pill.neutral{ background:var(--neutral-soft); color:var(--neutral); }

.pill-select{
  display:inline-flex; align-items:center; padding:3px 6px 3px 10px; border-radius:999px; font-size:.72rem; font-weight:600;
  border:none; cursor:pointer; font-family:inherit;
}
.pill-select:hover{ filter:brightness(.96); }
.pill-select.ok{ background:var(--ok-soft); color:var(--ok); }
.pill-select.warn{ background:var(--warn-soft); color:var(--warn); }
.pill-select.crit{ background:var(--crit-soft); color:var(--crit); }
.pill-select.neutral{ background:var(--neutral-soft); color:var(--neutral); }

.empty{ padding:60px 20px; text-align:center; color:var(--ink-soft); }
.empty h3{ font-size:1.05rem; margin-bottom:6px; color:var(--ink); }
.empty p{ margin:0 0 18px; font-size:.86rem; }

.detail-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:22px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.detail-header .idline{ font-family:var(--font-mono); font-size:.76rem; color:var(--ink-faint); margin-bottom:4px; }
.detail-body{ padding:22px 24px; }
.field-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px 20px; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field.span2{ grid-column:span 2; }
.field label{ font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
.field input, .field select, .field textarea{
  border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 11px; color:var(--ink); width:100%;
}
.field input.input-duplicado{ color:var(--crit); border-color:var(--crit); }
.field textarea{ resize:vertical; min-height:64px; font-family:var(--font-ui); }
.field .readval{ padding:9px 0; font-size:.92rem; }
.field .readval.mono{ font-family:var(--font-mono); }

.itens-head{ display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px; }
.itens-summary{ display:flex; gap:18px; font-size:.8rem; color:var(--ink-soft); flex-wrap:wrap; }
.itens-summary b{ color:var(--ink); font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

.overlay{ position:fixed; inset:0; background:rgba(18,22,28,.45); display:flex; justify-content:flex-end; z-index:50; opacity:0; pointer-events:none; transition:opacity .18s ease; }
.overlay.open{ opacity:1; pointer-events:auto; }
.panel{ width:min(520px,100%); background:var(--surface); height:100%; box-shadow:var(--shadow-md); display:flex; flex-direction:column; transform:translateX(24px); transition:transform .2s ease; overflow-y:auto; }
.overlay.open .panel{ transform:translateX(0); }
.panel-header{ display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); }
.panel-header h2{ font-size:1.1rem; }
.icon-btn{ all:unset; cursor:pointer; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:7px; color:var(--ink-soft); }
.icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
.panel-body{ padding:22px 24px; display:flex; flex-direction:column; gap:16px; flex:1; }
.panel-footer{ padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:var(--surface); }

.confirm-overlay{ position:fixed; inset:0; background:rgba(18,22,28,.5); display:flex; align-items:center; justify-content:center; z-index:60; opacity:0; pointer-events:none; transition:opacity .15s ease; }
.confirm-overlay.open{ opacity:1; pointer-events:auto; }
.confirm-box{ background:var(--surface); border-radius:var(--radius); padding:22px; width:min(360px,90vw); box-shadow:var(--shadow-md); }
.confirm-box p{ margin:0 0 18px; font-size:.9rem; color:var(--ink-soft); }
.confirm-box .row{ display:flex; justify-content:flex-end; gap:10px; }

.toast{ position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:8px; font-size:.85rem; box-shadow:var(--shadow-md); z-index:80; opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease; max-width:340px; }
.toast.open{ opacity:1; transform:translateY(0); }
.toast.crit{ background:var(--crit); color:#fff; }

.roadmap-note{ font-size:.78rem; color:var(--ink-faint); padding:12px 8px; border-top:1px solid var(--line-soft); margin-top:4px; }

@media (max-width: 820px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); padding:12px; }
  .brand{ padding:0 6px; }
  .nav-group{ flex-direction:row; }
  .nav-label, .identity, .roadmap-note{ display:none; }
  .main{ padding:18px; }
  .field.span2{ grid-column:auto; }
}

@media print{
  .no-print{ display:none !important; }
  .sidebar{ display:none !important; }
  .main{ padding:0; max-width:100%; }
  body{ background:#fff !important; color:#000 !important; }
  .card{ background:#fff !important; box-shadow:none; border:1px solid #ccc; }
  .table-wrap{ overflow-x:visible; }
  table{ font-size:11px; }
  th{ color:#333 !important; }
  input, select{ border:none !important; background:none !important; box-shadow:none !important; padding:2px !important; }
}

#print-area{ display:none; }
@media print{
  body.printing-doc .app{ display:none !important; }
  body.printing-doc #print-area{ display:block !important; }
  #print-area *{ font-family: Helvetica, Arial, sans-serif; box-sizing:border-box; }
  #print-area .doc-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14pt; }
  #print-area .doc-title{ font-size:18pt; font-weight:bold; color:#141414; }
  #print-area .doc-subtitle{ font-size:12pt; color:#464646; margin-top:4pt; }
  #print-area .doc-header-right{ text-align:right; }
  #print-area .doc-box{ margin-bottom:6pt; }
  #print-area .doc-box .label{ display:block; font-size:7pt; color:#646464; text-transform:uppercase; letter-spacing:.03em; }
  #print-area .doc-box b{ font-size:11pt; color:#141414; }
  #print-area .doc-hr{ border:none; border-top:1px solid #d2d2d2; margin:10pt 0 16pt; }
  #print-area .doc-fields{ margin-bottom:12pt; }
  #print-area .doc-fields div{ font-size:9pt; margin-bottom:5pt; color:#141414; }
  #print-area .doc-fields .label{ color:#646464; }
  #print-area table{ width:100%; border-collapse:collapse; font-size:7pt; }
  #print-area th, #print-area td{ border:1px solid #ccc; padding:3pt 4pt; text-align:left; }
  #print-area th{ background:#ebebeb !important; color:#141414; font-weight:bold; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>

<div class="app" id="app"></div>
<div id="panel-root"></div>
<div id="confirm-root"></div>
<div id="toast-root"></div>
<div id="print-area"></div>

function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ordenarPorNumeroItem(itens){ return [...itens].sort((x,y)=>(x.numeroItem||'').localeCompare(y.numeroItem||'', undefined, {numeric:true})); }
function fmtBRL(n){ n=Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); if(!y) return iso; return `${d}/${m}/${y}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(iso){ if(!iso) return null; const a=new Date(todayISO()+'T00:00:00'); const b=new Date(iso+'T00:00:00'); return Math.round((b-a)/86400000); }
function addDaysISO(iso, days){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+(Number(days)||0));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function toast(msg, level){
  const root=document.getElementById('toast-root');
  const el=document.createElement('div');
  el.className='toast'+(level==='crit'?' crit':'');
  el.textContent=msg;
  root.innerHTML='';
  root.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('open'));
  setTimeout(()=>{ el.classList.remove('open'); setTimeout(()=>{ if(root.contains(el)) root.removeChild(el); },250); }, 4200);
}

function confirmDialog(message){
  return new Promise(resolve=>{
    const root=document.getElementById('confirm-root');
    root.innerHTML = `
      <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
          <p>${esc(message)}</p>
          <div class="row">
            <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
            <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
          </div>
        </div>
      </div>`;
    requestAnimationFrame(()=>document.getElementById('confirm-overlay').classList.add('open'));
    function close(v){ document.getElementById('confirm-overlay').classList.remove('open'); setTimeout(()=>root.innerHTML='',180); resolve(v); }
    document.getElementById('confirm-cancel').onclick=()=>close(false);
    document.getElementById('confirm-ok').onclick=()=>close(true);
  });
}

function gerarSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashSenha(senha, salt){
  const enc = new TextEncoder();
  const data = enc.encode(salt+':'+senha);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function verificarLogin(nome, senha){
  const usuario = state.usuarios.find(u=>(u.nome||'').trim().toLowerCase()===(nome||'').trim().toLowerCase());

  const hash = await hashSenha(senha, usuario.senhaSalt);
  return hash===usuario.senhaHash;
}

function criarDownloadsLocal(){
  return {
    save: async({filename, data})=>{
      const mime = /\.csv$/i.test(filename) ? 'text/csv;charset=utf-8' : (data instanceof Blob ? data.type : 'application/octet-stream');
      const blob = (data instanceof Blob) ? data : new Blob([data], {type: mime});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      return {status:'saved'};
    },
  };
}

async function recomputeAtaCache(ataId){
  const snap = await state.db.collection('atas/'+ataId+'/itens').get();
  let valorTotal=0, valorUtilizado=0, lucroTotal=0, lucroUtilizado=0, itensCount=0, itensEsgotados=0;
  snap.docs.forEach(d=>{
    const it=d.data();
    itensCount++;
    const unit = Number(it.valorUnitario)||0;
    const custo = Number(it.valorCusto)||0;
    valorTotal += (Number(it.quantidadeContratada)||0) * unit;
    valorUtilizado += (Number(it.quantidadeConsumida)||0) * unit;
    if(custo>0){
      lucroTotal += (Number(it.quantidadeContratada)||0) * (unit-custo);
      lucroUtilizado += (Number(it.quantidadeConsumida)||0) * (unit-custo);
    }
    const saldoQtd = (Number(it.quantidadeContratada)||0) - (Number(it.quantidadeConsumida)||0);
    if(saldoQtd<=0) itensEsgotados++;
  });

function numeroParaCSV(n){
  const v = Number(n)||0;
  let s = v.toFixed(2);
  if(s.endsWith('.00')) s = s.slice(0,-3);
  else if(s.endsWith('0')) s = s.slice(0,-1);
  return s.replace('.', ',');
}
function csvEscape(v){
  const s = String(v===undefined||v===null?'':v);
  if(/[;"\r\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
const ITEM_PLANILHA_HEADER = ['Item','Lote','Descrição','Marca','Unidade','Quantidade Contratada','Valor Unitário','Valor de Custo','Quantidade Consumida','Observações'];

async function exportarItensAtaCSV(ata){

    else toast('Não foi possível exportar a planilha.', 'crit');

}

function parseNumeroBR(v){
  if(typeof v === 'number') return v;
  if(v===undefined || v===null || v==='') return 0;
  let s = String(v).trim();
  if(!s) return 0;
  if(s.includes(',')){ s = s.replace(/\./g,'').replace(',', '.'); }
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function normalizarHeaderPlanilha(h){
  return String(h||'').trim().toLowerCase()
    .replace(/[áàâã]/g,'a').replace(/[éèê]/g,'e').replace(/[íìî]/g,'i')
    .replace(/[óòôõ]/g,'o').replace(/[úùû]/g,'u').replace(/ç/g,'c');
}
function parseCSVTexto(text, delimiter){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else { field += c; }
    } else {
      if(c==='"'){ inQuotes = true; }
      else if(c===delimiter){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* ignora */ }
      else { field += c; }
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}
const CAMPOS_PLANILHA_ITEM = {
  'item':'numeroItem', 'no item':'numeroItem', 'n item':'numeroItem', 'numero item':'numeroItem',
  'lote':'lote',
  'descricao':'descricao', 'descricao do produto/servico':'descricao',
  'marca':'marca', 'marca/fabricante':'marca',
  'unidade':'unidade',
  'quantidade contratada':'quantidadeContratada', 'qtd contratada':'quantidadeContratada', 'quantidade':'quantidadeContratada',
  'valor unitario':'valorUnitario', 'valor unit':'valorUnitario', 'valor unit.':'valorUnitario',
  'valor de custo':'valorCusto', 'valor custo':'valorCusto', 'custo':'valorCusto',
  'quantidade consumida':'quantidadeConsumida', 'quantidade ja entregue/consumida':'quantidadeConsumida', 'qtd consumida':'quantidadeConsumida',
  'observacoes':'observacoes', 'observacao':'observacoes',
};
function mapearLinhasParaItens(linhas){
  const itens = [], erros = [];
  if(!linhas || linhas.length===0) return {itens, erros};
  const header = linhas[0].map(h=>normalizarHeaderPlanilha(h));
  const colIndex = {};
  header.forEach((h,i)=>{ const campo = CAMPOS_PLANILHA_ITEM[h]; if(campo && colIndex[campo]===undefined) colIndex[campo]=i; });
  for(let i=1;i<linhas.length;i++){
    const row = linhas[i]||[];
    if(row.every(c=>c===''||c===undefined||c===null)) continue;
    const get = (campo)=> colIndex[campo]!==undefined ? row[colIndex[campo]] : '';
    const descricao = String(get('descricao')||'').trim();
    const quantidadeContratada = parseNumeroBR(get('quantidadeContratada'));
    const valorUnitario = parseNumeroBR(get('valorUnitario'));
    if(!descricao || quantidadeContratada<=0){ erros.push('Linha '+(i+1)+' ignorada (faltando descrição ou quantidade).'); continue; }
    itens.push({
      numeroItem: String(get('numeroItem')||'').trim() || String(itens.length+1),
      lote: String(get('lote')||'').trim(),
      descricao, marca: String(get('marca')||'').trim(), unidade: String(get('unidade')||'').trim(),
      quantidadeContratada, valorUnitario,
      valorCusto: parseNumeroBR(get('valorCusto')),
      quantidadeConsumida: parseNumeroBR(get('quantidadeConsumida')),
      observacoes: String(get('observacoes')||'').trim(),
    });
  }
  return {itens, erros};
}
async function lerPlanilhaComoLinhas(file){
  const nome = (file.name||'').toLowerCase();
  if(nome.endsWith('.xlsx') || nome.endsWith('.xls')){
    if(typeof XLSX==='undefined'){ throw new Error('planilha-lib-nao-carregada'); }
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
  }
  const text = await file.text();
  const semBom = text.charCodeAt(0)===0xFEFF ? text.slice(1) : text;
  const primeiraLinha = semBom.split(/\r?\n/)[0] || '';
  const delim = (primeiraLinha.match(/;/g)||[]).length >= (primeiraLinha.match(/,/g)||[]).length ? ';' : ',';
  return parseCSVTexto(semBom, delim);
}
function abrirImportarItensAta(ata){
  if(!ata) return;
  if(!exigirPermissaoEdicao()) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv,.xlsx,.xls';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async ()=>{
    const file = input.files[0];
    document.body.removeChild(input);
    if(!file) return;
    try{
      const linhas = await lerPlanilhaComoLinhas(file);
      const { itens, erros } = mapearLinhasParaItens(linhas);
      if(itens.length===0){
        toast(erros.length ? erros[0] : 'Nenhum item encontrado na planilha.', 'crit');
        return;
      }
      let msg = `Importar ${itens.length} item(ns) da planilha para esta Ata?`;
      if(erros.length>0) msg += ` (${erros.length} linha(s) foram ignoradas por estarem incompletas.)`;
      const ok = await confirmDialog(msg);
      if(!ok) return;
      await importarItensAta(ata.id, itens);
    }catch(e){
      console.error(e);
      if(e && e.message==='planilha-lib-nao-carregada'){ toast('O leitor de planilha ainda está carregando. Tente novamente em instantes.', 'crit'); }
      else toast('Não foi possível ler a planilha. Verifique o arquivo e tente novamente.', 'crit');
    }
  });
  input.click();
}

function pedidoById(id){ return state.pedidos.find(p=>p.id===id); }

async function adjustItemConsumption(ataId, itensPedido, sign){
  for(const it of itensPedido){
    if(!it.itemId) continue;
    const ref = state.db.doc('atas/'+ataId+'/itens/'+it.itemId);
    const snap = await ref.get();
    if(!snap.exists) continue;
    const cur = snap.data();
    const nova = Math.max(0, (Number(cur.quantidadeConsumida)||0) + sign*(Number(it.quantidade)||0));
    await ref.update({quantidadeConsumida: nova});
  }
}

function statusQuantityOverride(status, quantidadePedida, curEntregue){
  if(status==='Lancado') return {quantidadeSeparada:0, quantidadeEntregue:0};
  if(status==='Separado') return {quantidadeSeparada:quantidadePedida, quantidadeEntregue:Math.min(Number(curEntregue)||0, quantidadePedida)};
  if(status==='Entregue') return {quantidadeSeparada:quantidadePedida, quantidadeEntregue:quantidadePedida};
  return null;
}

async function recomputePedidoCache(pedidoId, statusOverride){
  const snap = await state.db.collection('pedidos/'+pedidoId+'/itens').get();
  const itens = snap.docs.map(d=>d.data());
  const status = statusOverride!==undefined ? statusOverride : ((pedidoById(pedidoId)||{}).status);
  const cancelado = status==='Cancelado';
  let valorTotal=0, valorSeparado=0, valorEntregue=0;
  itens.forEach(it=>{
    const qtd = Number(it.quantidade)||0;
    const unit = Number(it.valorUnitario)||0;
    valorTotal += qtd*unit;
    valorSeparado += Math.min(Number(it.quantidadeSeparada)||0, qtd)*unit;
    valorEntregue += Math.min(Number(it.quantidadeEntregue)||0, qtd)*unit;
  });
  const saldoSeparar = cancelado ? 0 : (valorTotal-valorSeparado);
  const saldoEntregar = cancelado ? 0 : (valorTotal-valorEntregue);
  await state.db.doc('pedidos/'+pedidoId).update({valorSeparado, saldoSeparar, valorEntregue, saldoEntregar});
}

function findPedidoDuplicado(ordemCompra, empenho, excludeId){
  const oc = (ordemCompra||'').trim().toLowerCase();
  const emp = (empenho||'').trim().toLowerCase();
  if(!oc && !emp) return null;
  for(const p of state.pedidos){
    if(p.id===excludeId) continue;
    const pOc = (p.ordemCompra||'').trim().toLowerCase();
    const pEmp = (p.empenho||'').trim().toLowerCase();
    if(oc && pOc && pOc===oc) return {field:'ordemCompra', pedido:p};
    if(emp && pEmp && pEmp===emp) return {field:'empenho', pedido:p};
  }
  return null;
}

function pedidoCampoJaUsado(field, value, excludeId){
  const v = (value||'').trim().toLowerCase();
  if(!v) return false;
  return state.pedidos.some(p=>p.id!==excludeId && (p[field]||'').trim().toLowerCase()===v);
}

function wirePedidoDuplicadoCheck(input, field, excludeId){
  if(!input) return;
  const check = ()=>{ input.classList.toggle('input-duplicado', pedidoCampoJaUsado(field, input.value, excludeId)); };
  input.addEventListener('input', check);
  check();
}

async function updatePedidoStatus(pedido, newStatus){
  if(newStatus===pedido.status) return;
  if(!exigirPermissaoEdicao()) return;
  try{
    const itensSnap = await state.db.collection('pedidos/'+pedido.id+'/itens').get();
    const itensData = itensSnap.docs.map(d=>({id:d.id, ...d.data()}));
    const wasCancelado = pedido.status==='Cancelado';
    const willBeCancelado = newStatus==='Cancelado';
    if(wasCancelado && !willBeCancelado){ await adjustItemConsumption(pedido.ataId, itensData, +1); }
    else if(!wasCancelado && willBeCancelado){ await adjustItemConsumption(pedido.ataId, itensData, -1); }

    for(const it of itensData){
      const override = statusQuantityOverride(newStatus, Number(it.quantidade)||0, it.quantidadeEntregue);
      if(override){ await state.db.doc('pedidos/'+pedido.id+'/itens/'+it.id).update(override); }
    }

    const statusAntesCancelamento = willBeCancelado ? {statusAntesCancelamento: pedido.status} : {};
    await dbCall(state.db.doc('pedidos/'+pedido.id).update({
      status:newStatus, ...statusAntesCancelamento, atualizadoPor: state.nome||'—', atualizadoEm: new Date().toISOString(),
    }), 'Status do pedido atualizado.');
    if(wasCancelado!==willBeCancelado){ await recomputeAtaCache(pedido.ataId); }
    await recomputePedidoCache(pedido.id, newStatus);
    if(state.currentPedidoId===pedido.id){ await loadPedidoItens(pedido.id); }
  }catch(e){}
}

async function updatePedido(pedido, novosItens, meta){
  if(!exigirPermissaoEdicao()) return false;
  try{
    const itensSnap = await state.db.collection('pedidos/'+pedido.id+'/itens').get();
    const itensAntigos = itensSnap.docs.map(d=>d.data());
    const wasCancelado = pedido.status==='Cancelado';
    const willBeCancelado = meta.status==='Cancelado';
    const prevSeparadaByItemId = {};
    const prevEntregueByItemId = {};
    itensAntigos.forEach(it=>{
      if(!it.itemId) return;
      prevSeparadaByItemId[it.itemId] = (prevSeparadaByItemId[it.itemId]||0) + (Number(it.quantidadeSeparada)||0);
      prevEntregueByItemId[it.itemId] = (prevEntregueByItemId[it.itemId]||0) + (Number(it.quantidadeEntregue)||0);
    });

    if(!wasCancelado){ await adjustItemConsumption(pedido.ataId, itensAntigos, -1); }
    for(const d of itensSnap.docs){ await state.db.doc('pedidos/'+pedido.id+'/itens/'+d.id).delete(); }
    for(const it of novosItens){
      const qtd = Number(it.quantidade)||0;
      const quantidadeSeparada = Math.min(prevSeparadaByItemId[it.itemId]||0, qtd);
      const quantidadeEntregue = Math.min(prevEntregueByItemId[it.itemId]||0, qtd);
      const override = statusQuantityOverride(meta.status, qtd, quantidadeEntregue);
      await state.db.collection('pedidos/'+pedido.id+'/itens').add({
        ...it, quantidadeSeparada, quantidadeEntregue, ...(override||{}),
      });
    }
    if(!willBeCancelado){ await adjustItemConsumption(pedido.ataId, novosItens, +1); }

    const valorTotal = novosItens.reduce((s,it)=>s+(Number(it.valorUnitario)||0)*(Number(it.quantidade)||0),0);
    const prazoEntregaDias = Number(pedido.prazoEntregaDias)||0;
    const dataLimiteEntrega = prazoEntregaDias>0 ? addDaysISO(meta.dataPedido, prazoEntregaDias) : '';
    await dbCall(state.db.doc('pedidos/'+pedido.id).update({
      ...meta, dataLimiteEntrega, valorTotal, atualizadoPor: state.nome||'—', atualizadoEm: new Date().toISOString(),
    }), 'Pedido atualizado.');
    await recomputeAtaCache(pedido.ataId);
    await recomputePedidoCache(pedido.id, meta.status);
    if(state.currentPedidoId===pedido.id){ await loadPedidoItens(pedido.id); }
    return true;
  }catch(e){ console.error(e); return false; }
}

async function loadSaldoPendenteCompras(){
  state.saldoPendenteCompraLoading = true;
  render();
  const pedidosAbertos = state.pedidos.filter(p=>p.status!=='Entregue' && p.status!=='Cancelado');
  const itensSnaps = await Promise.all(pedidosAbertos.map(p=>state.db.collection('pedidos/'+p.id+'/itens').get()));
  const linhas = [];
  pedidosAbertos.forEach((p,i)=>{
    itensSnaps[i].docs.forEach(d=>{
      const it = d.data();
      const qtd = Number(it.quantidade)||0;
      const sep = Math.min(Number(it.quantidadeSeparada)||0, qtd);
      const key = p.id+'__'+d.id;
      const saldo = Math.max(0, qtd-sep);
      if(saldo<=0) return;
      const prev = state.saldoPendenteCompra.find(l=>l.key===key);
      const ata = ataById(p.ataId);
      linhas.push({
        key, pedidoId:p.id, pedidoItemId:d.id, ataItemId:it.itemId,
        orgao:p.orgao, secretaria:p.secretaria, empenho:p.empenho, ordemCompra:p.ordemCompra, ataNumero:p.ataNumero, dataPedido:p.dataPedido,
        empresaId: ata&&ata.empresaId||'', empresaNome: ata&&ata.empresaNome||'',
        descricao:it.descricao, marca:it.marca, unidade:it.unidade, numeroItem:it.numeroItem, lote:it.lote,
        saldo, qtd: prev ? Math.min(prev.qtd, saldo) : saldo, valorUnitario: it.valorUnitario||0,
        checked: prev ? prev.checked : false,
      });
    });
  });
  linhas.sort((a,b)=>(a.orgao||'').localeCompare(b.orgao||'')||(a.descricao||'').localeCompare(b.descricao||''));
  state.saldoPendenteCompra = linhas;
  state.saldoPendenteCompraLoaded = true;
  state.saldoPendenteCompraLoading = false;
  render();
}

async function deletePedidoCompra(id){
  if(!exigirPermissaoEdicao()) return false;
  const ok = await confirmDialog('Excluir este pedido de compra e todos os seus itens? O saldo pendente para comprar dos itens ligados a um Pedido volta a aparecer.');
  if(!ok) return false;
  try{
    const itensSnap = await state.db.collection('pedidosCompra/'+id+'/itens').get();
    const chaves = itensSnap.docs
      .map(d=>d.data())
      .filter(it=>it.origemPedidoId && it.origemPedidoItemId)
      .map(it=>({origemPedidoId:it.origemPedidoId, origemPedidoItemId:it.origemPedidoItemId}));
    for(const d of itensSnap.docs){ await state.db.doc('pedidosCompra/'+id+'/itens/'+d.id).delete(); }
    await dbCall(state.db.doc('pedidosCompra/'+id).delete(), 'Pedido de compra excluído.');
    if(chaves.length){
      const pedidosAfetados = await sincronizarSeparacoesComRecebimentos(chaves);
      for(const pid of pedidosAfetados){ await reconciliarPedidoAposRecebimento(pid); }
    }
    if(state.saldoPendenteCompraLoaded){ loadSaldoPendenteCompras(); }
    return true;
  }catch(e){ return false; }
}

function faturaById(id){ return state.faturas.find(f=>f.id===id); }

async function loadSaldoPendenteFaturamento(){
  state.saldoPendenteFaturamentoLoading = true;
  render();
  const pedidosComEntrega = state.pedidos.filter(p=>p.status==='Entregue' || p.status==='Entregue Parcial');
  const [itensSnaps, faturaItensSnaps] = await Promise.all([
    Promise.all(pedidosComEntrega.map(p=>state.db.collection('pedidos/'+p.id+'/itens').get())),
    Promise.all(state.faturas.map(f=>state.db.collection('faturas/'+f.id+'/itens').get())),
  ]);
  const faturadoPorItem = {};
  state.faturas.forEach((f,i)=>{
    if(f.status==='Cancelada') return;
    faturaItensSnaps[i].docs.forEach(d=>{
      const it = d.data();
      if(!it.origemPedidoId || !it.origemPedidoItemId) return;
      const k = it.origemPedidoId+'__'+it.origemPedidoItemId;
      faturadoPorItem[k] = (faturadoPorItem[k]||0) + (Number(it.quantidade)||0);
    });
  });
  const linhas = [];
  pedidosComEntrega.forEach((p,i)=>{
    itensSnaps[i].docs.forEach(d=>{
      const it = d.data();
      const qtd = Number(it.quantidade)||0;
      const entregue = Math.min(Number(it.quantidadeEntregue)||0, qtd);
      const key = p.id+'__'+d.id;
      const jaFaturado = faturadoPorItem[key]||0;
      const saldo = Math.max(0, entregue-jaFaturado);
      if(saldo<=0) return;
      const prev = state.saldoPendenteFaturamento.find(l=>l.key===key);
      const ata = ataById(p.ataId);
      linhas.push({
        key, pedidoId:p.id, pedidoItemId:d.id, ataItemId:it.itemId,
        orgao:p.orgao, secretaria:p.secretaria, empenho:p.empenho, ordemCompra:p.ordemCompra, ataNumero:p.ataNumero, dataPedido:p.dataPedido,
        empresaId: ata&&ata.empresaId||'', empresaNome: ata&&ata.empresaNome||'',
        descricao:it.descricao, marca:it.marca, unidade:it.unidade, numeroItem:it.numeroItem, lote:it.lote,
        saldo, qtd: prev ? Math.min(prev.qtd, saldo) : saldo, valorUnitario: it.valorUnitario||0, valorCusto: it.valorCusto||0,
        checked: prev ? prev.checked : false,
      });
    });
  });
  linhas.sort((a,b)=>(a.orgao||'').localeCompare(b.orgao||'')||(a.descricao||'').localeCompare(b.descricao||''));
  state.saldoPendenteFaturamento = linhas;
  state.saldoPendenteFaturamentoLoaded = true;
  state.saldoPendenteFaturamentoLoading = false;
  render();
}

function toggleSaldoPendenteFaturamento(key, checked){

  render();
}

async function createFatura(itensSelecionados, meta){
  if(!exigirPermissaoEdicao()) return null;
  const valorTotal = itensSelecionados.reduce((s,it)=>s+(Number(it.valorUnitario)||0)*(Number(it.quantidade)||0),0);
  let lucroTotal=0, valorComCusto=0;
  itensSelecionados.forEach(it=>{
    const custo = Number(it.valorCusto)||0;
    if(custo>0){
      const qtd = Number(it.quantidade)||0;
      lucroTotal += qtd*((Number(it.valorUnitario)||0)-custo);
      valorComCusto += qtd*(Number(it.valorUnitario)||0);
    }
  });
  const doc = await dbCall(state.db.collection('faturas').add({
    ...meta, valorTotal, valorPago:0, saldoReceber:valorTotal, lucroTotal, valorComCusto,
    criadoPor: state.nome||'—', criadoEm: new Date().toISOString(),
  }), 'Fatura criada.');
  for(const it of itensSelecionados){
    await state.db.collection('faturas/'+doc.id+'/itens').add(it);
  }
  return doc;
}

async function revertEstadoAnteriorPedido(pedidoId, estadoAnterior){
  try{
    const pedido = pedidoById(pedidoId);
    if(!pedido) return;
    for(const it of (estadoAnterior.itens||[])){
      try{ await state.db.doc('pedidos/'+pedidoId+'/itens/'+it.id).update({quantidadeEntregue: it.quantidadeEntregue}); }catch(e){}
    }
    await dbCall(state.db.doc('pedidos/'+pedidoId).update({
      status: estadoAnterior.status, atualizadoPor: state.nome||'—', atualizadoEm: new Date().toISOString(),
    }), 'Pedido revertido para '+(STATUS_PEDIDO_LABEL[estadoAnterior.status]||estadoAnterior.status)+'.');
    await recomputePedidoCache(pedidoId, estadoAnterior.status);
    if(state.currentPedidoId===pedidoId){ await loadPedidoItens(pedidoId); }
  }catch(e){}
}

async function deleteFatura(id){
  if(!exigirPermissaoEdicao()) return false;
  const fatura = faturaById(id);
  const temEstadoAnterior = !!(fatura && fatura.estadoAnteriorPedido && fatura.estadoAnteriorPedidoId);
  const statusAnteriorLabel = temEstadoAnterior ? (STATUS_PEDIDO_LABEL[fatura.estadoAnteriorPedido.status]||fatura.estadoAnteriorPedido.status) : '';
  const ok = await confirmDialog(temEstadoAnterior
    ? `Excluir esta fatura e todos os seus itens? O pedido de origem volta para o status "${statusAnteriorLabel}".`
    : 'Excluir esta fatura e todos os seus itens?');
  if(!ok) return false;
  try{
    const itensSnap = await state.db.collection('faturas/'+id+'/itens').get();
    for(const d of itensSnap.docs){ await state.db.doc('faturas/'+id+'/itens/'+d.id).delete(); }
    await dbCall(state.db.doc('faturas/'+id).delete(), 'Fatura excluída.');
    if(temEstadoAnterior){ await revertEstadoAnteriorPedido(fatura.estadoAnteriorPedidoId, fatura.estadoAnteriorPedido); }
    return true;
  }catch(e){ return false; }
}

function closePanel(){
  const overlay = document.getElementById('panel-overlay');
  if(overlay) overlay.classList.remove('open');
  setTimeout(()=>{ document.getElementById('panel-root').innerHTML=''; }, 180);
}
function openPanel(html){
  document.getElementById('panel-root').innerHTML = `<div class="overlay" id="panel-overlay">${html}</div>`;
  requestAnimationFrame(()=>document.getElementById('panel-overlay').classList.add('open'));
  document.getElementById('panel-overlay').addEventListener('mousedown', e=>{ if(e.target.id==='panel-overlay') closePanel(); });
}

    else{ await addItem(ataId, data); }
    closePanel();
  };
}

function statusRecebidoOverride(status, quantidadePedida){
  if(status==='Lancado') return {quantidadeRecebida:0};
  if(status==='Recebido') return {quantidadeRecebida:quantidadePedida};
  return null;
}

async function recomputePedidoCompraCache(id, statusOverride){
  const snap = await state.db.collection('pedidosCompra/'+id+'/itens').get();
  const itens = snap.docs.map(d=>d.data());
  const status = statusOverride!==undefined ? statusOverride : ((pedidoCompraById(id)||{}).status);
  const cancelado = status==='Cancelado';
  let valorTotal=0, valorRecebido=0;
  itens.forEach(it=>{
    const qtd = Number(it.quantidade)||0;
    const unit = Number(it.valorUnitario)||0;
    valorTotal += qtd*unit;
    valorRecebido += Math.min(Number(it.quantidadeRecebida)||0, qtd)*unit;
  });
  const saldoReceber = cancelado ? 0 : (valorTotal-valorRecebido);
  await state.db.doc('pedidosCompra/'+id).update({valorRecebido, saldoReceber});
}

async function sincronizarSeparacoesComRecebimentos(keys){
  const pedidosAfetados = new Set();
  const chavesValidas = (keys||[]).filter(k=>k && k.origemPedidoId && k.origemPedidoItemId);
  if(!chavesValidas.length) return pedidosAfetados;
  try{
    const comprasSnap = await state.db.collection('pedidosCompra').get();
    const compras = comprasSnap.docs.map(d=>({id:d.id, ...d.data()}));
    const itensSnaps = await Promise.all(compras.map(pc=>state.db.collection('pedidosCompra/'+pc.id+'/itens').get()));
    const totalPorKey = {};
    compras.forEach((pc,i)=>{
      if(pc.status==='Cancelado') return;
      itensSnaps[i].docs.forEach(d=>{
        const it = d.data();
        if(!it.origemPedidoId || !it.origemPedidoItemId) return;
        const k = it.origemPedidoId+'__'+it.origemPedidoItemId;
        totalPorKey[k] = (totalPorKey[k]||0) + (Number(it.quantidadeRecebida)||0);
      });
    });
    const chavesFeitas = new Set();
    for(const {origemPedidoId, origemPedidoItemId} of chavesValidas){
      const k = origemPedidoId+'__'+origemPedidoItemId;
      if(chavesFeitas.has(k)) continue;
      chavesFeitas.add(k);
      const totalRecebido = totalPorKey[k]||0;
      const ref = state.db.doc('pedidos/'+origemPedidoId+'/itens/'+origemPedidoItemId);
      const snap = await ref.get();
      if(!snap.exists) continue;
      const it = snap.data();
      const qtd = Number(it.quantidade)||0;
      const baseline = Number(it.quantidadeSeparadaViaCompra)||0;
      const delta = totalRecebido-baseline;
      if(delta===0) continue;
      const atual = Number(it.quantidadeSeparada)||0;
      const nova = Math.max(0, Math.min(qtd, atual+delta));
      await ref.update({quantidadeSeparada: nova, quantidadeSeparadaViaCompra: totalRecebido});
      pedidosAfetados.add(origemPedidoId);
    }
  }catch(e){ console.error(e); }
  return pedidosAfetados;
}

async function reconciliarPedidoAposRecebimento(pedidoId){
  const pedido = pedidoById(pedidoId);
  if(!pedido) return;
  if(pedido.status==='Cancelado' || pedido.status==='Entregue' || pedido.status==='Entregue Parcial'){
    await recomputePedidoCache(pedidoId, pedido.status);
    if(state.currentPedidoId===pedidoId){ await loadPedidoItens(pedidoId); }
    return;
  }
  const itensSnap = await state.db.collection('pedidos/'+pedidoId+'/itens').get();
  let totalQtd=0, totalSep=0;
  itensSnap.docs.forEach(d=>{ const x=d.data(); const q=Number(x.quantidade)||0; totalQtd+=q; totalSep+=Math.min(Number(x.quantidadeSeparada)||0,q); });
  const novoStatus = totalSep<=0 ? 'Lancado' : (totalSep>=totalQtd ? 'Separado' : 'Separado Parcial');
  await finalizarStatusPedido(pedido, novoStatus, null);
}

async function commitPedidoCompraItemQuantity(pedidoCompra, itemId, el, maxQty){
  if(!exigirPermissaoEdicao()) return;
  const value = Math.max(0, Math.min(Number(el.value)||0, maxQty));
  try{
    const itemAntes = state.currentPedidoCompraItens.find(x=>x.id===itemId) || {};
    await state.db.doc('pedidosCompra/'+pedidoCompra.id+'/itens/'+itemId).update({quantidadeRecebida: value});
    await recomputePedidoCompraCache(pedidoCompra.id, pedidoCompra.status);
    await loadPedidoCompraItens(pedidoCompra.id);
    if(itemAntes.origemPedidoId && itemAntes.origemPedidoItemId){
      const pedidosAfetados = await sincronizarSeparacoesComRecebimentos([{origemPedidoId:itemAntes.origemPedidoId, origemPedidoItemId:itemAntes.origemPedidoItemId}]);
      for(const pid of pedidosAfetados){ await reconciliarPedidoAposRecebimento(pid); }
      if(state.saldoPendenteCompraLoaded){ loadSaldoPendenteCompras(); }
      if(pedidosAfetados.size>0){ toast('Quantidade recebida salva. Separação atualizada no pedido de origem.'); }
    }else if(state.saldoPendenteCompraLoaded){ loadSaldoPendenteCompras(); }
  }catch(e){
    toast('Não foi possível salvar a quantidade.', 'crit');
  }
}

async function updatePedidoCompraStatus(pedidoCompra, newStatus){
  if(newStatus===pedidoCompra.status) return;
  if(!exigirPermissaoEdicao()) return;
  try{
    const itensSnap = await state.db.collection('pedidosCompra/'+pedidoCompra.id+'/itens').get();
    const chaves = [];
    for(const d of itensSnap.docs){
      const it = d.data();
      const override = statusRecebidoOverride(newStatus, Number(it.quantidade)||0);
      if(override){ await state.db.doc('pedidosCompra/'+pedidoCompra.id+'/itens/'+d.id).update(override); }
      if(it.origemPedidoId && it.origemPedidoItemId){ chaves.push({origemPedidoId:it.origemPedidoId, origemPedidoItemId:it.origemPedidoItemId}); }
    }
    await state.db.doc('pedidosCompra/'+pedidoCompra.id).update({
      status:newStatus, atualizadoPor: state.nome||'—', atualizadoEm: new Date().toISOString(),
    });
    await recomputePedidoCompraCache(pedidoCompra.id, newStatus);
    if(state.currentPedidoCompraId===pedidoCompra.id){ await loadPedidoCompraItens(pedidoCompra.id); }
    const pedidosAfetados = await sincronizarSeparacoesComRecebimentos(chaves);
    for(const pid of pedidosAfetados){ await reconciliarPedidoAposRecebimento(pid); }
    if(state.saldoPendenteCompraLoaded){ loadSaldoPendenteCompras(); }
    toast(pedidosAfetados.size>0 ? `Status atualizado. Separação atualizada em ${pedidosAfetados.size} pedido(s) vinculado(s).` : 'Status atualizado.');
  }catch(e){
    toast('Não foi possível salvar: '+(e && e.message ? e.message : 'erro desconhecido'), 'crit');
  }
}

function statusValorPagoOverride(status, valorTotal){
  if(status==='Emitida') return {valorPago:0};
  if(status==='Paga') return {valorPago:valorTotal};
  return null;
}

async function commitFaturaValorPago(fatura, el){
  if(!exigirPermissaoEdicao()) return;
  const valorTotal = Number(fatura.valorTotal)||0;
  const value = Math.max(0, Math.min(Number(el.value)||0, valorTotal));
  try{
    await state.db.doc('faturas/'+fatura.id).update({ valorPago: value, saldoReceber: valorTotal-value });
  }catch(e){
    toast('Não foi possível salvar o valor pago.', 'crit');
  }
}

async function updateFaturaStatus(fatura, newStatus){
  if(newStatus===fatura.status) return;
  if(!exigirPermissaoEdicao()) return;
  try{
    const valorTotal = Number(fatura.valorTotal)||0;
    const override = statusValorPagoOverride(newStatus, valorTotal);
    const valorPago = override ? override.valorPago : (Number(fatura.valorPago)||0);
    const saldoReceber = newStatus==='Cancelada' ? 0 : (valorTotal-valorPago);
    await dbCall(state.db.doc('faturas/'+fatura.id).update({
      status:newStatus, valorPago, saldoReceber,
      atualizadoPor: state.nome||'—', atualizadoEm: new Date().toISOString(),
    }), 'Status atualizado.');
    const wasCancelada = fatura.status==='Cancelada';
    const willBeCancelada = newStatus==='Cancelada';
    if(wasCancelada!==willBeCancelada && state.saldoPendenteFaturamentoLoaded){ loadSaldoPendenteFaturamento(); }
  }catch(e){}
}

        await state.db.doc('pedidos/'+pedido.id+'/itens/'+u.itemId).update({quantidadeSeparada: u.quantidadeSeparada});
      }
      const novoStatus = totalSep<=0 ? 'Lancado' : (totalSep>=totalQtd ? 'Separado' : 'Separado Parcial');
      await finalizarStatusPedido(pedido, novoStatus, 'Separação registrada.');
      closePanel();
    }catch(e){
      toast('Não foi possível registrar a separação.', 'crit');
    }
  };
}

async function openFaturarPedidoForm(pedido){
  const [itensSnap, faturaItensSnaps] = await Promise.all([
    state.db.collection('pedidos/'+pedido.id+'/itens').get(),
    Promise.all(state.faturas.filter(f=>f.status!=='Cancelada').map(f=>state.db.collection('faturas/'+f.id+'/itens').get())),
  ]);
  const itens = ordenarPorNumeroItem(itensSnap.docs.map(d=>({id:d.id, ...d.data()})));
  const jaFaturadoPorItem = {};
  faturaItensSnaps.forEach(snap=>{
    snap.docs.forEach(d=>{
      const it = d.data();
      if(it.origemPedidoId!==pedido.id || !it.origemPedidoItemId) return;
      jaFaturadoPorItem[it.origemPedidoItemId] = (jaFaturadoPorItem[it.origemPedidoItemId]||0) + (Number(it.quantidade)||0);
    });
  });
  const today = todayISO();

  openPanel(`
    <div class="panel" style="width:min(780px,100%)">
      <div class="panel-header">
        <h2>Faturar Pedido</h2>
        <button class="icon-btn" onclick="closePanel()">${ICONS.close}</button>
      </div>
      <form id="faturar-pedido-form" class="panel-body">
        <div class="field-grid">
          <div class="field"><label>Número da nota fiscal</label>
            <input name="numeroNota" required>
          </div>
          <div class="field"><label>Série</label>
            <input name="serieNota">
          </div>
          <div class="field"><label>Data de emissão</label>
            <input type="date" name="dataEmissao" value="${today}">
          </div>
          <div class="field"><label>Data de vencimento</label>
            <input type="date" name="dataVencimento">
          </div>
          <div class="field"><label>Status</label>
            <select name="status">${STATUS_FATURA.map(s=>`<option value="${s}" ${s==='Emitida'?'selected':''}>${STATUS_FATURA_LABEL[s]}</option>`).join('')}</select>
          </div>
        </div>
        <div style="margin-top:10px">
          <label style="font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:block;margin-bottom:8px">Itens a faturar</label>
          <p style="font-size:.78rem;color:var(--ink-faint);margin:0 0 8px">O máximo de cada item é o que já foi separado e ainda não consta em nenhuma fatura.</p>
          <div class="table-wrap"><table>
            <thead><tr><th>Item</th><th>Descrição</th><th>Marca</th><th>Un.</th><th>Separado</th><th>Já faturado</th><th>Saldo faturável</th><th>Qtd. a faturar</th><th>Valor unit.</th></tr></thead>
            <tbody>
              ${itens.map(it=>{
                const qtd = Number(it.quantidade)||0;
                const separado = Math.min(Number(it.quantidadeSeparada)||0, qtd);
                const jaFaturado = jaFaturadoPorItem[it.id]||0;
                const saldo = Math.max(0, separado-jaFaturado);
                return `<tr>
                  <td class="mono">${esc(it.numeroItem)||'—'}</td>
                  <td class="wrap-desc">${esc(it.descricao)}</td>
                  <td>${esc(it.marca)||'—'}</td>
                  <td>${esc(it.unidade)||'—'}</td>
                  <td class="num">${separado}</td>
                  <td class="num">${jaFaturado}</td>
                  <td class="num">${saldo}</td>
                  <td><input type="number" min="0" max="${saldo}" step="0.01" style="width:90px" class="faturar-qtd-input" data-item-id="${it.id}" data-qtd="${qtd}" data-jafaturado="${jaFaturado}" data-valor="${it.valorUnitario||0}" data-custo="${it.valorCusto||0}" data-marca="${esc(it.marca||'')}" data-un="${esc(it.unidade||'')}" data-numero="${esc(it.numeroItem||'')}" data-lote="${esc(it.lote||'')}" data-desc="${esc(it.descricao)}" data-itemid-origem="${esc(it.itemId||'')}" value="${saldo||''}" placeholder="0" ${saldo<=0?'disabled':''}></td>
                  <td class="num">${fmtBRL(it.valorUnitario)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table></div>
        </div>
        <div class="field-grid" style="margin-top:6px">
          <div class="field span2"><label>Observações</label>
            <textarea name="observacoes"></textarea>
          </div>
        </div>
      </form>
      <div class="panel-footer">
        <button class="btn btn-ghost" onclick="closePanel()">Cancelar</button>
        <button class="btn btn-primary" id="faturar-pedido-submit">Criar fatura</button>
      </div>
    </div>`);

  document.getElementById('faturar-pedido-submit').onclick = async ()=>{
    if(!exigirPermissaoEdicao()) return;
    const form = document.getElementById('faturar-pedido-form');
    if(!form.reportValidity()) return;
    const inputs = Array.from(document.querySelectorAll('.faturar-qtd-input'));
    const itensSelecionados = [];
    const entregaUpdates = [];
    const estadoAnteriorItens = [];
    for(const inp of inputs){
      const qtdTotal = Number(inp.dataset.qtd)||0;
      const jaFaturado = Number(inp.dataset.jafaturado)||0;
      const saldoMax = Math.max(0, qtdTotal-jaFaturado);
      const chosen = Math.max(0, Math.min(Number(inp.value)||0, saldoMax));
      const itemDoc = itens.find(x=>x.id===inp.dataset.itemId);
      const entregueAntes = itemDoc ? (Number(itemDoc.quantidadeEntregue)||0) : 0;
      estadoAnteriorItens.push({id: inp.dataset.itemId, quantidadeEntregue: entregueAntes});
      if(chosen>0){
        itensSelecionados.push({
          descricao: inp.dataset.desc, unidade: inp.dataset.un, marca: inp.dataset.marca,
          numeroItem: inp.dataset.numero, lote: inp.dataset.lote,
          quantidade: chosen, valorUnitario: Number(inp.dataset.valor)||0, valorCusto: Number(inp.dataset.custo)||0,
          origemItemId: inp.dataset.itemidOrigem||undefined,
          origemPedidoItemId: inp.dataset.itemId, origemPedidoId: pedido.id,
        });
        entregaUpdates.push({itemId: inp.dataset.itemId, quantidadeEntregue: jaFaturado+chosen});
      }
    }
    if(itensSelecionados.length===0){ toast('Informe ao menos uma quantidade a faturar.', 'crit'); return; }

    const fd = new FormData(form);
    const meta = {
      numeroNota: fd.get('numeroNota'), serieNota: fd.get('serieNota'),
      dataEmissao: fd.get('dataEmissao'), dataVencimento: fd.get('dataVencimento'),
      status: fd.get('status'), observacoes: fd.get('observacoes'),
      origemPedidoIds: [pedido.id], origemPedidoInfo: (pedido.ataNumero||'')+' — '+(pedido.orgao||''),
      estadoAnteriorPedidoId: pedido.id, estadoAnteriorPedido: {status: pedido.status, itens: estadoAnteriorItens},
    };
    try{
      for(const u of entregaUpdates){
        await state.db.doc('pedidos/'+pedido.id+'/itens/'+u.itemId).update({quantidadeEntregue: u.quantidadeEntregue});
      }
      const itensAtuais = await state.db.collection('pedidos/'+pedido.id+'/itens').get();
      let somaQtd=0, somaEntregue=0;
      itensAtuais.docs.forEach(d=>{ const x=d.data(); const q=Number(x.quantidade)||0; somaQtd+=q; somaEntregue+=Math.min(Number(x.quantidadeEntregue)||0,q); });
      const novoStatus = somaEntregue<=0 ? pedido.status : (somaEntregue>=somaQtd ? 'Entregue' : 'Entregue Parcial');
      await createFatura(itensSelecionados, meta);
      await finalizarStatusPedido(pedido, novoStatus, 'Status do pedido atualizado.');
      closePanel();
      if(state.saldoPendenteFaturamentoLoaded){ loadSaldoPendenteFaturamento(); }
      if(state.view==='faturamento'){ render(); }
    }catch(e){
      toast('Não foi possível criar a fatura.', 'crit');
    }
  };
}

          <label style="font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:block;margin-bottom:8px">Itens avulsos (sem pedido de origem)</label>

    if(linhas.length===0){

    } else {
      area.innerHTML = `<div class="table-wrap"><table>

          ${linhas.map((l,i)=>`
            <tr>

              <td>${esc(l.marca)||'—'}</td>
              <td>${esc(l.unidade)||'—'}</td>
              <td class="num">${l.saldo}</td>
              <td><input type="number" min="0" max="${l.saldo}" step="0.01" style="width:80px" value="${l.qtd}" onchange="faturaSetLinhaQty(${i}, this.value)"></td>
              <td class="num">${fmtBRL(l.valorUnitario)}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>`;
    }
    const marcadas = linhas.filter(l=>l.checked && Number(l.qtd)>0);
    const total = marcadas.reduce((s,l)=>s+l.qtd*(Number(l.valorUnitario)||0),0);
    document.getElementById('fatura-auto-summary').textContent = `${marcadas.length} item(ns) selecionado(s) — ${fmtBRL(total)}`;
  }
  window.faturaToggleLinha = function(i, checked){ linhas[i].checked = checked; renderAutoTable(); };
  window.faturaSetLinhaQty = function(i, val){ linhas[i].qtd = Math.max(0, Math.min(Number(val)||0, linhas[i].saldo)); renderAutoTable(); };
  renderAutoTable();

  function renderRows(){
    const area = document.getElementById('fatura-itens-area');
    if(!area) return;
    if(window.__faturaManualRows.length===0){
      area.innerHTML = '<div class="empty" style="padding:16px"><p>Nenhum item avulso.</p></div>';
      return;
    }
    area.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Descrição</th><th>Marca</th><th>Un.</th><th>Quantidade</th><th>Valor unit. (R$)</th><th></th></tr></thead>
      <tbody>

            <td><input data-row="${i}" data-field="descricao" value="${esc(row.descricao)}" placeholder="Produto/serviço"></td>

            <td><input type="number" min="0" step="0.01" data-row="${i}" data-field="valorUnitario" value="${row.valorUnitario||''}" style="width:90px" placeholder="0,00"></td>
            <td><button type="button" class="icon-btn" onclick="faturaRemoveRow(${i})">${ICONS.trash}</button></td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
    area.querySelectorAll('input[data-row]').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const r = Number(e.target.dataset.row);
        const f = e.target.dataset.field;
        window.__faturaManualRows[r][f] = (f==='quantidade'||f==='valorUnitario') ? Number(e.target.value)||0 : e.target.value;
      });
    });
  }
  window.faturaAddRow = function(){
    window.__faturaManualRows.push({descricao:'', marca:'', unidade:'', quantidade:0, valorUnitario:0});
    renderRows();
  };
  window.faturaRemoveRow = function(i){
    window.__faturaManualRows.splice(i,1);
    renderRows();
  };
  renderRows();

  document.getElementById('fatura-form-submit').onclick = async ()=>{
    const form = document.getElementById('fatura-form');
    if(!form.reportValidity()) return;
    const linhasChecadas = linhas.filter(l=>l.checked && Number(l.qtd)>0);
    const doAuto = linhasChecadas.map(l=>({
      descricao: l.descricao, unidade: l.unidade, marca: l.marca, numeroItem: l.numeroItem, lote: l.lote,
      quantidade: l.qtd, valorUnitario: l.valorUnitario, valorCusto: l.valorCusto||0,
      origemItemId: l.ataItemId, origemPedidoItemId: l.pedidoItemId, origemPedidoId: l.pedidoId,
    }));
    const doManual = window.__faturaManualRows.filter(r=>r.descricao && Number(r.quantidade)>0);
    const itensSelecionados = [...doAuto, ...doManual];
    if(itensSelecionados.length===0){ toast('Selecione ao menos um item pendente ou adicione um item avulso.', 'crit'); return; }
    const origemPedidoIds = [...new Set(doAuto.map(it=>it.origemPedidoId))];
    const origemPedidoInfo = origemPedidoIds.map(id=>{
      const p = pedidoById(id);
      return p ? ((p.ataNumero||'')+' — '+(p.orgao||'')) : '';
    }).filter(Boolean).join('; ');
    const fd = new FormData(form);
    const meta = {
      numeroNota: fd.get('numeroNota'), serieNota: fd.get('serieNota'),
      dataEmissao: fd.get('dataEmissao'), dataVencimento: fd.get('dataVencimento'),
      status: fd.get('status'), observacoes: fd.get('observacoes'),
      origemPedidoIds, origemPedidoInfo,
    };
    if(pedidoOrigem && pedidoOrigem.__estadoAnteriorPedido){
      meta.estadoAnteriorPedidoId = pedidoOrigem.id;
      meta.estadoAnteriorPedido = pedidoOrigem.__estadoAnteriorPedido;
    }
    await createFatura(itensSelecionados, meta);
    const keysIncluidas = new Set(linhasChecadas.map(l=>l.key));
    state.saldoPendenteFaturamento.forEach(l=>{ if(keysIncluidas.has(l.key)) l.checked = false; });
    closePanel();
    if(state.view==='faturamento'){ render(); }
  };
}

function vigenciaPill(ata){
  if(ata.status!=='Vigente') return `<span class="pill ${STATUS_ATA_LEVEL[ata.status]||'neutral'}">${esc(STATUS_ATA_LABEL[ata.status]||ata.status||'—')}</span>`;
  const d = daysUntil(ata.fimVigencia);
  if(d===null) return `<span class="pill ok">Vigente</span>`;
  if(d<0) return `<span class="pill crit">Vencida há ${Math.abs(d)}d</span>`;
  if(d<=60) return `<span class="pill warn">Vence em ${d}d</span>`;
  return `<span class="pill ok">Vigente</span>`;
}

function pedidoSaldoEntregarCache(p){
  return p.saldoEntregar!==undefined ? p.saldoEntregar : p.valorTotal;

function prazoEntregaInfo(p){
  if(p.status==='Cancelado') return {texto:'—', nivel:'neutral'};
  if(!p.dataLimiteEntrega) return {texto:'Sem prazo', nivel:'neutral'};
  if(p.status==='Entregue') return {texto:fmtDate(p.dataLimiteEntrega), nivel:'ok'};
  const d = daysUntil(p.dataLimiteEntrega);
  if(d<0) return {texto:'Atrasado '+Math.abs(d)+'d', nivel:'crit'};
  if(d<=5) return {texto:'Vence em '+d+'d', nivel:'warn'};
  return {texto:fmtDate(p.dataLimiteEntrega), nivel:'ok'};
}
function prazoEntregaPill(p){
  const {texto, nivel} = prazoEntregaInfo(p);
  return `<span class="pill ${nivel}">${esc(texto)}</span>`;
}

function custoMinimoById(id){ return state.custosMinimos.find(c=>c.id===id); }
function margemVendaValor(c){
  return (c.margemVenda===undefined || c.margemVenda===null || c.margemVenda==='') ? 25 : (Number(c.margemVenda)||0);
}
function custoValor(c){
  const valorItem = Number(c.custo)||0;
  if(valorItem<=0) return 0;
  const ipi = Number(c.ipi)||0;
  return valorItem*(1+ipi/100);
}
function custoMinimoValor(c){
  const custo = custoValor(c);
  if(custo<=0) return 0;
  const pctLogistica = (Number(c.frete)||0)+(Number(c.difal)||0)+(Number(c.outraDisp)||0);
  return custo*(1+pctLogistica/100)*(1+margemVendaValor(c)/100);
}
function custoUnitarioValor(c){
  const custo = custoValor(c);
  const numero = Number(c.numeroUnidades)||0;
  if(custo<=0 || numero<=0) return 0;
  return custo/numero;
}
function minimoUnitarioValor(c){
  const custoUnit = custoUnitarioValor(c);
  if(custoUnit<=0) return 0;
  const pctLogistica = (Number(c.frete)||0)+(Number(c.difal)||0)+(Number(c.outraDisp)||0);
  return custoUnit*(1+pctLogistica/100)*(1+margemVendaValor(c)/100);
}

const MES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function mesLabel(mesNum){ return MES_NOMES[mesNum-1] || ''; }
function anoMesStr(ano, mes){ return ano+'-'+String(mes).padStart(2,'0'); }
function faturasDoMes(ano, mes){
  const am = anoMesStr(ano, mes);
  return state.faturas.filter(f=>f.status!=='Cancelada' && (f.dataEmissao||'').slice(0,7)===am);
}
function despesasDoMes(ano, mes){
  const am = anoMesStr(ano, mes);
  return state.despesas.filter(d=>d.mes===am);
}
function lucroBrutoMes(ano, mes){
  return faturasDoMes(ano, mes).reduce((s,f)=>s+(Number(f.lucroTotal)||0),0);
}
function despesasTotalMes(ano, mes){
  return despesasDoMes(ano, mes).reduce((s,d)=>s+(Number(d.valor)||0),0);
}
function lucroLiquidoMes(ano, mes){
  return lucroBrutoMes(ano,mes) - despesasTotalMes(ano,mes);
}

function renderPainel(){
  const atas = state.atas;
  const vigentes = atas.filter(a=>a.status==='Vigente').length;
  const vencendo = atas.filter(a=>a.status==='Vigente' && a.fimVigencia && daysUntil(a.fimVigencia)>=0 && daysUntil(a.fimVigencia)<=60).length;
  const vencidas = atas.filter(a=>a.status==='Vigente' && a.fimVigencia && daysUntil(a.fimVigencia)<0).length;
  const valorTotal = atas.reduce((s,a)=>s+(Number(a.valorTotal)||0),0);
  const valorUtilizado = atas.reduce((s,a)=>s+(Number(a.valorUtilizado)||0),0);
  const saldo = valorTotal - valorUtilizado;
  const esgotados = atas.reduce((s,a)=>s+(Number(a.itensEsgotados)||0),0);

  const atencao = atas
    .filter(a=>a.status==='Vigente' && a.fimVigencia && daysUntil(a.fimVigencia)<=60)
    .sort((a,b)=>daysUntil(a.fimVigencia)-daysUntil(b.fimVigencia))
    .slice(0,8);

  const pedidosPendentes = state.pedidos.filter(p=>p.status!=='Entregue' && p.status!=='Cancelado').length;
  const saldoTotalEntregar = state.pedidos.reduce((s,p)=>s+(Number(pedidoSaldoEntregarCache(p))||0),0);
  const saldoTotalReceber = state.pedidosCompra.reduce((s,p)=>s+(Number(pedidoCompraSaldoReceberCache(p))||0),0);
  const saldoTotalFaturamento = state.faturas.reduce((s,f)=>s+(Number(faturaSaldoReceberCache(f))||0),0);

  return `
    <div class="topbar">
      <div><h1>Painel</h1><div class="sub">Resumo em tempo real das Atas, Contratos e Pedidos cadastrados.</div></div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">Atas/Contratos</div><div class="value">${atas.length}</div></div>
      <div class="kpi"><div class="label">Vigentes</div><div class="value ok">${vigentes}</div></div>
      <div class="kpi"><div class="label">Vencendo ≤ 60 dias</div><div class="value ${vencendo?'warn':''}">${vencendo}</div></div>
      <div class="kpi"><div class="label">Vencidas</div><div class="value ${vencidas?'crit':''}">${vencidas}</div></div>
      <div class="kpi"><div class="label">Valor total contratado</div><div class="value">${fmtBRL(valorTotal)}</div></div>
      <div class="kpi"><div class="label">Saldo disponível</div><div class="value">${fmtBRL(saldo)}</div></div>
      <div class="kpi"><div class="label">Itens esgotados</div><div class="value ${esgotados?'crit':''}">${esgotados}</div></div>
      <div class="kpi"><div class="label">Pedidos</div><div class="value">${state.pedidos.length}</div></div>
      <div class="kpi"><div class="label">Pedidos em andamento</div><div class="value ${pedidosPendentes?'warn':''}">${pedidosPendentes}</div></div>
      <div class="kpi"><div class="label">Saldo total a entregar</div><div class="value ${saldoTotalEntregar?'warn':''}">${fmtBRL(saldoTotalEntregar)}</div></div>
      <div class="kpi"><div class="label">Pedidos de Compra</div><div class="value">${state.pedidosCompra.length}</div></div>
      <div class="kpi"><div class="label">Saldo total a receber (compras)</div><div class="value ${saldoTotalReceber?'warn':''}">${fmtBRL(saldoTotalReceber)}</div></div>
      <div class="kpi"><div class="label">Faturas emitidas</div><div class="value">${state.faturas.length}</div></div>
      <div class="kpi"><div class="label">Saldo total a receber (faturamento)</div><div class="value ${saldoTotalFaturamento?'warn':''}">${fmtBRL(saldoTotalFaturamento)}</div></div>
    </div>
    <h3 class="section-title">Vencimentos que pedem atenção</h3>
    <div class="card">
      ${atencao.length===0 ? `<div class="empty"><h3>Nada vencendo nos próximos 60 dias</h3><p>Quando uma vigência se aproximar do fim, ela aparece aqui.</p></div>` : `
      <div class="table-wrap"><table>
        <thead><tr><th>Órgão</th><th>Número</th><th>Objeto</th><th>Vigência</th></tr></thead>
        <tbody>
          ${atencao.map(a=>`
            <tr onclick="setView('ata-detail',{ataId:'${a.id}'})">
              <td>${esc(a.orgao)}</td>
              <td class="mono">${esc(a.numero)}</td>
              <td class="truncate">${esc(a.objeto)}</td>
              <td>${vigenciaPill(a)}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>`}
    </div>`;
}

function renderAtasList(){
  let rows = state.atas;
  if(state.statusFilter!=='todas') rows = rows.filter(a=>a.status===state.statusFilter);
  if(state.empresaFilter!=='todas') rows = rows.filter(a=>a.empresaId===state.empresaFilter);
  if(state.search.trim()){
    const q = state.search.toLowerCase();
    rows = rows.filter(a=> (a.orgao||'').toLowerCase().includes(q) || (a.numero||'').toLowerCase().includes(q) || (a.objeto||'').toLowerCase().includes(q) || (a.cidade||'').toLowerCase().includes(q) || (a.empresaNome||'').toLowerCase().includes(q));
  }
  rows = [...rows].sort((a,b)=>(a.fimVigencia||'9999').localeCompare(b.fimVigencia||'9999'));

        ${podeEditar()?`<button class="btn btn-primary" onclick="openAtaForm()">${ICONS.plus}Nova Ata</button>`:''}</div>
      ` : rows.length===0 ? `<div class="empty"><h3>Nada encontrado</h3><p>Ajuste a busca ou os filtros.</p></div>` : `

        <thead><tr><th>Empresa</th><th>Número</th><th>Órgão</th><th>Cidade</th><th>Objeto</th><th>Modalidade</th><th>Vigência</th><th>Valor total</th><th>Status</th></tr></thead>

              <td>${esc(a.empresaNome)||'—'}</td>
              <td class="mono">${esc(a.numero)}</td>
              <td>${esc(a.orgao)}</td>
              <td>${esc(a.cidade)||'—'}</td>
              <td class="truncate">${esc(a.objeto)}</td>

            </tr>`).join('')}

function itemStatus(it){
  const saldo = (Number(it.quantidadeContratada)||0) - (Number(it.quantidadeConsumida)||0);
  const pct = (Number(it.quantidadeContratada)||0)>0 ? saldo/Number(it.quantidadeContratada) : 1;
  if(saldo<=0) return {level:'crit', label:'Esgotado'};
  if(pct<=0.2) return {level:'warn', label:'Baixo estoque'};
  return {level:'ok', label:'Disponível'};
}

      valorComCusto += qtd*(Number(it.valorUnitario)||0);

      <div class="kpi"><div class="label">Lucro previsto</div><div class="value ${lucroTotal<0?'crit':'ok'}">${fmtBRL(lucroTotal)}</div></div>
      <div class="kpi"><div class="label">Margem de lucro</div><div class="value ${margemLucro===null?'':(margemLucro<0?'crit':'ok')}">${margemLucro===null?'—':margemLucro.toFixed(1)+'%'}</div></div>

function pedidosFiltrados(){
  let rows = state.pedidos;
  if(state.pedidoStatusFilter!=='todas') rows = rows.filter(p=>p.status===state.pedidoStatusFilter);
  if(state.pedidoEmpresaFilter!=='todas') rows = rows.filter(p=>(ataById(p.ataId)||{}).empresaId===state.pedidoEmpresaFilter);
  if(state.pedidoSearch.trim()){
    const q = state.pedidoSearch.toLowerCase();
    rows = rows.filter(p=> (p.orgao||'').toLowerCase().includes(q) || (p.ataNumero||'').toLowerCase().includes(q) || (p.observacoes||'').toLowerCase().includes(q) || (p.secretaria||'').toLowerCase().includes(q) || (p.empenho||'').toLowerCase().includes(q) || (p.ordemCompra||'').toLowerCase().includes(q) || (p.cidade||'').toLowerCase().includes(q) || ((ataById(p.ataId)||{}).empresaNome||'').toLowerCase().includes(q));
  }
  return [...rows].sort((a,b)=>(b.dataPedido||'').localeCompare(a.dataPedido||''));
}

function togglePedidoSelecionado(id){
  if(state.pedidosSelecionados.has(id)) state.pedidosSelecionados.delete(id);
  else state.pedidosSelecionados.add(id);
  render();
}
function toggleTodosPedidosSelecionados(){
  const ids = pedidosFiltrados().map(p=>p.id);
  const todosSelecionados = ids.length>0 && ids.every(id=>state.pedidosSelecionados.has(id));
  if(todosSelecionados) ids.forEach(id=>state.pedidosSelecionados.delete(id));
  else ids.forEach(id=>state.pedidosSelecionados.add(id));
  render();
}
function limparSelecaoPedidos(){
  state.pedidosSelecionados.clear();
  render();
}

function renderPedidoDetail(){

  const cancelado = p.status==='Cancelado';
  let valorTotalCalc=0, valorSeparadoCalc=0, valorEntregueCalc=0, lucroTotalCalc=0, valorComCustoCalc=0;
  itens.forEach(it=>{
    const qtd=Number(it.quantidade)||0, unit=Number(it.valorUnitario)||0, custo=Number(it.valorCusto)||0;
    valorTotalCalc += qtd*unit;
    valorSeparadoCalc += Math.min(Number(it.quantidadeSeparada)||0, qtd)*unit;
    valorEntregueCalc += Math.min(Number(it.quantidadeEntregue)||0, qtd)*unit;
    if(custo>0){ lucroTotalCalc += qtd*(unit-custo); valorComCustoCalc += qtd*unit; }
  });
  const saldoSeparar = cancelado?0:(valorTotalCalc-valorSeparadoCalc);
  const saldoEntregar = cancelado?0:(valorTotalCalc-valorEntregueCalc);
  const margemLucroCalc = valorComCustoCalc>0 ? (lucroTotalCalc/valorComCustoCalc*100) : null;
  const pedidosCompraDoPedido = state.pedidosCompra.filter(pc=>Array.isArray(pc.origemPedidoIds) ? pc.origemPedidoIds.includes(p.id) : pc.origemPedidoId===p.id).sort((x,y)=>(y.dataPedido||'').localeCompare(x.dataPedido||''));
  const faturasDoPedido = state.faturas.filter(f=>Array.isArray(f.origemPedidoIds) ? f.origemPedidoIds.includes(p.id) : f.origemPedidoId===p.id).sort((x,y)=>(y.dataEmissao||'').localeCompare(x.dataEmissao||''));

      </div>
      <div class="actions no-print">
        ${podeEditar()?`
        ${p.status!=='Cancelado' ? `<button class="btn btn-primary" onclick="openSepararPedidoForm(pedidoById('${p.id}'))">${ICONS.box}Separar Pedido</button>` : ''}
        <button class="btn btn-primary" onclick="openPedidoCompraForm(pedidoById('${p.id}'))">${ICONS.inbox}Gerar Pedido de Compra</button>
        ${p.status!=='Cancelado' ? `<button class="btn btn-primary" onclick="openFaturarPedidoForm(pedidoById('${p.id}'))">${ICONS.sheet}Faturar</button>` : ''}
        `:''}
        <button class="btn btn-ghost" onclick="imprimirPagina()">${ICONS.print}Imprimir</button>
        <button class="btn btn-ghost" onclick="abrirImpressao()">${ICONS.print}Baixar PDF</button>
        ${podeEditar()?`
        <button class="btn btn-ghost" onclick="openPedidoEditForm(pedidoById('${p.id}'))">${ICONS.edit}Editar</button>
        ${p.status==='Cancelado'
          ? `<button class="btn btn-ghost" onclick="handleReabrirPedido(pedidoById('${p.id}'))">${ICONS.back}Reabrir Pedido</button>`
          : `<button class="btn btn-ghost" onclick="handleCancelarPedido(pedidoById('${p.id}'))">${ICONS.close}Cancelar Pedido</button>`}
        <button class="btn btn-danger" onclick="handleDeletePedido('${p.id}')">${ICONS.trash}Excluir</button>
        `:''}
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="label">Valor total do pedido</div><div class="value">${fmtBRL(p.valorTotal)}</div></div>

      <div class="kpi"><div class="label">Saldo a entregar</div><div class="value ${saldoEntregar>0?'warn':'ok'}">${fmtBRL(saldoEntregar)}</div></div>
      <div class="kpi"><div class="label">Lucro previsto</div><div class="value ${lucroTotalCalc<0?'crit':'ok'}">${fmtBRL(lucroTotalCalc)}</div></div>
      <div class="kpi"><div class="label">Margem de lucro</div><div class="value ${margemLucroCalc===null?'':(margemLucroCalc<0?'crit':'ok')}">${margemLucroCalc===null?'—':margemLucroCalc.toFixed(1)+'%'}</div></div>
      <div class="kpi"><div class="label">Prazo de entrega</div><div class="value" style="font-size:1.05rem">${prazoEntregaPill(p)}</div></div>

async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function pdfBRL(n){ return fmtBRL(n).replace(/ /g,' '); }

function montarPdfPedido(doc, left){
  const p = pedidoById(state.currentPedidoId);
  if(!p) return null;
  montarPdfPedidoConteudo(doc, left, p, state.currentPedidoItens);
  return 'pedido-'+(p.dataPedido||'')+'.pdf';
